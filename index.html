<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b2230">
<title>OilPOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dexie/3.2.7/dexie.min.js"></script>
<style>
:root{--ink:#1b2230;--ink2:#2a3448;--bg:#eef1f5;--line:#dde2ea;--amber:#e8a317;--amberd:#a86f00;--green:#1f8a5b;--red:#c23b2a;--muted:#6b7587;--text:#1c2433}
*{box-sizing:border-box}
html,body{height:100%}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--text);margin:0}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.5rem .95rem;border-radius:.55rem;font-weight:700;font-size:.9rem;border:1px solid transparent;cursor:pointer;transition:background .15s;white-space:nowrap;font-family:inherit}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.inp:focus-visible,.nav-item:focus-visible{outline:3px solid #f5c35a;outline-offset:2px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-pri{background:var(--amber);color:#2a1d00}.btn-pri:hover{background:#f2b434}
.btn-dark{background:var(--ink);color:#fff}.btn-dark:hover{background:var(--ink2)}
.btn-sec{background:#fff;border-color:var(--line);color:var(--text)}.btn-sec:hover{background:#f5f7fa}
.btn-dng{background:var(--red);color:#fff}.btn-dng:hover{background:#a82f20}
.btn-ok{background:var(--green);color:#fff}.btn-ok:hover{background:#18704a}
.btn-sm{padding:.28rem .6rem;font-size:.78rem;border-radius:.45rem}
.btn-lg{padding:.8rem 1.2rem;font-size:1.05rem}
.inp{width:100%;padding:.55rem .75rem;border:1px solid var(--line);border-radius:.55rem;background:#fff;font-size:.95rem;font-family:inherit;color:var(--text)}
.inp:focus{outline:2px solid var(--amber);border-color:var(--amber)}
input[type=number]{direction:ltr;text-align:right}
.lbl{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:.25rem}
.card{background:#fff;border:1px solid var(--line);border-radius:.8rem}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{background:#f6f8fb;color:var(--muted);font-weight:700;text-align:right;padding:.6rem .7rem;white-space:nowrap;border-bottom:1px solid var(--line);font-size:.78rem}
.tbl td{padding:.55rem .7rem;border-bottom:1px solid #eef1f5;vertical-align:middle}
.tbl tbody tr:hover{background:#fafbfd}
.badge{display:inline-block;padding:.1rem .55rem;border-radius:999px;font-size:.72rem;font-weight:700;background:#eef1f5;color:var(--muted)}
.b-ok{background:#dcf3e8;color:#12623f}.b-red{background:#fbe1dd;color:#9b2a1c}.b-amb{background:#fdecc4;color:#7a4b00}.b-blue{background:#dbeafe;color:#1e40af}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:.55rem;overflow:hidden;background:#fff}
.seg button{padding:.32rem .75rem;font-size:.8rem;font-weight:700;background:#fff;cursor:pointer;font-family:inherit;border:0;color:var(--text)}
.seg button+button{border-right:1px solid var(--line)}
.seg button.on{background:var(--ink);color:#fff}
.nav-item{display:flex;align-items:center;gap:.7rem;width:100%;padding:.65rem .9rem;border-radius:.6rem;color:#b9c2d3;font-weight:600;font-size:.93rem;cursor:pointer;background:transparent;border:0;font-family:inherit;text-align:right}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.on{background:var(--amber);color:#2a1d00}
.ptile{text-align:right;background:#fff;border:1px solid var(--line);border-radius:.8rem;padding:.7rem .8rem;display:flex;flex-direction:column;gap:.2rem;min-height:6.8rem;cursor:pointer;font-family:inherit}
.ptile:hover{border-color:var(--amber);box-shadow:0 0 0 3px #e8a31730}
.ptile.out{opacity:.55}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:.5rem;overflow:hidden;background:#fff}
.qty button{width:2rem;height:2rem;font-size:1.1rem;font-weight:800;background:#f3f5f8;border:0;cursor:pointer;font-family:inherit}
.qty input{width:3rem;text-align:center;border:0;height:2rem;font-weight:700;font-family:inherit;direction:ltr}
.link{background:none;border:0;color:var(--amberd);font-weight:700;cursor:pointer;font-family:inherit;font-size:.8rem;padding:0}
.totalbox{background:var(--ink);color:#fff;border-radius:.8rem;padding:.8rem 1rem;display:flex;align-items:baseline;gap:.5rem}
.totalbox span{font-size:.9rem;color:#b9c2d3;font-weight:600;flex:1}
.totalbox strong{font-size:2.1rem;line-height:1;color:var(--amber);font-weight:800}
.totalbox small{color:#b9c2d3;font-weight:600}
.stat{padding:1rem 1.1rem}
.stat .k{font-size:.78rem;font-weight:700;color:var(--muted)}
.stat .v{font-size:1.5rem;font-weight:800;margin-top:.15rem}
.empty{text-align:center;color:var(--muted);padding:1.6rem .5rem;font-size:.9rem}
.toast{padding:.7rem 1rem;border-radius:.65rem;color:#fff;font-weight:700;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.2);background:var(--ink);max-width:22rem}
.toast.ok{background:var(--green)}.toast.err{background:var(--red)}.toast.warn{background:var(--amberd)}
.modal-ov{background:rgba(20,26,38,.55)}
.modal-body{max-height:calc(100vh - 11rem);overflow-y:auto}
#printArea{display:none;font-family:'Cairo',sans-serif;color:#000;background:#fff;direction:rtl}
.rc{font-size:12px;line-height:1.5}
.rc h1{font-size:1.35em;text-align:center;font-weight:800;margin:0}
.rc .c{text-align:center}
.rc hr{border:0;border-top:1px dashed #000;margin:4px 0}
.rc .r{display:flex;justify-content:space-between;gap:6px}
.rc .b{font-weight:800}
.rc .big{font-size:1.25em}
.chat-me{background:var(--ink);color:#fff;align-self:flex-end;max-width:85%;padding:.75rem 1rem;border-radius:.75rem;white-space:pre-wrap;line-height:1.7;font-size:.9rem}
.chat-bot{background:#f6f8fb;color:var(--text);align-self:flex-start;max-width:85%;padding:.75rem 1rem;border-radius:.75rem;white-space:pre-wrap;line-height:1.7;font-size:.9rem}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;margin:0;padding:2mm 3mm}
  body{background:#fff}
}
</style>
</head>
<body>

<div id="login" style="display:none" class="min-h-screen flex items-center justify-center p-4"></div>

<div id="app" style="display:none" class="h-screen flex overflow-hidden">
  <div id="scrim" style="display:none" class="fixed inset-0 bg-black/40 z-30" onclick="toggleSide(false)"></div>
  <aside id="side" class="fixed lg:static inset-y-0 right-0 z-40 w-64 shrink-0 translate-x-full lg:translate-x-0 transition-transform flex flex-col" style="background:var(--ink)">
    <div class="flex items-center gap-3 px-5 py-5">
      <svg viewBox="0 0 32 32" class="w-9 h-9"><path d="M16 3c4 6 9 10.5 9 16a9 9 0 0 1-18 0C7 13.5 12 9 16 3z" fill="#e8a317"/><path d="M12 20a4 4 0 0 0 4 4" stroke="#1b2230" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <div><div class="text-white font-extrabold text-xl leading-none">OilPOS</div><div id="sideShop" class="text-xs mt-1 truncate max-w-[10rem]" style="color:#8e99ae"></div></div>
    </div>
    <nav id="nav" class="flex-1 overflow-y-auto px-3 pb-4 space-y-1"></nav>
    <div class="px-4 py-3 text-xs" style="color:#8e99ae;border-top:1px solid rgba(255,255,255,.08)">OilPOS v4 • يعمل محلياً</div>
  </aside>
  <div class="flex-1 min-w-0 flex flex-col">
    <header class="flex items-center gap-3 px-3 md:px-5 py-3 bg-white" style="border-bottom:1px solid var(--line)">
      <button class="btn btn-sec btn-sm lg:hidden" onclick="toggleSide(true)" id="menuBtn"></button>
      <h1 id="pageTitle" class="font-extrabold text-lg md:text-xl truncate"></h1>
      <div class="flex-1"></div>
      <span id="cloudChip" class="badge hidden sm:inline-block"></span>
      <span id="shiftChip" class="badge hidden md:inline-block"></span>
      <div class="text-right leading-tight hidden sm:block"><div id="uName" class="font-bold text-sm"></div><div id="uRole" class="text-xs muted"></div></div>
      <button class="btn btn-sec btn-sm" onclick="logout()" id="logoutBtn"></button>
    </header>
    <main id="view" class="flex-1 overflow-auto p-3 md:p-5"></main>
  </div>
</div>

<div id="modals"></div>
<div id="toasts" class="fixed top-3 left-3 z-[100] flex flex-col gap-2"></div>
<div id="printArea"></div>

<script>
'use strict';
/* ====================================================================
   OilPOS v4 — نسخة نظيفة مبسطة
   - المبرمج يضبط Supabase + AI من الإعدادات
   - رفع تلقائي للسحابة كل 5 دقايق
   - المدير يفتح نفس اللينك → "عرض بيانات المحل" → يشوف لوحة للقراءة
   ==================================================================== */

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
const num = v => { const n = parseFloat(String(v ?? '').replace(/[٠-٩]/g, d => AR_DIGITS.indexOf(d)).replace('٫','.')); return isFinite(n) ? n : 0; };
const r2 = n => Math.round((Number(n)||0) * 100) / 100;
const r4 = n => Math.round((Number(n)||0) * 10000) / 10000;
const money = n => r2(n).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:2});
const egp = n => money(n) + ' ج.م';
const LOC = 'ar-EG-u-nu-latn';
const fdate = t => new Date(t).toLocaleDateString(LOC, {year:'numeric',month:'2-digit',day:'2-digit'});
const ftime = t => new Date(t).toLocaleTimeString(LOC, {hour:'2-digit',minute:'2-digit'});
const fdt = t => fdate(t) + ' ' + ftime(t);
const sod = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const addDays = (t,n) => { const d = new Date(t); d.setDate(d.getDate()+n); return d.getTime(); };
const toInputDate = t => { const d = new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fromInputDate = s => s ? new Date(s+'T00:00:00').getTime() : sod(Date.now());
const ROLE_AR = {dev:'مبرمج', owner:'مالك', cashier:'كاشير', viewer:'مشاهد'};

const ICONS = {
  pos:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>',
  shift:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  invoices:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/>',
  products:'<path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/>',
  purchases:'<path d="M1 3h15v13H1zM16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>',
  suppliers:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
  customers:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  expenses:'<rect x="1" y="4" width="22" height="16" rx="2"/><path d="M1 10h22"/>',
  stockAdj:'<path d="M3 6h18M3 12h18M3 18h18"/><circle cx="8" cy="6" r="2" fill="#fff"/><circle cx="16" cy="12" r="2" fill="#fff"/><circle cx="10" cy="18" r="2" fill="#fff"/>',
  reports:'<path d="M12 20V10M18 20V4M6 20v-4"/>',
  ai:'<path d="M12 2a3 3 0 0 1 3 3v1a3 3 0 0 1 3 3v2a3 3 0 0 1-3 3h-1l-2 3-2-3H9a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3V5a3 3 0 0 1 3-3z"/><circle cx="9.5" cy="10.5" r="1" fill="#fff"/><circle cx="14.5" cy="10.5" r="1" fill="#fff"/>',
  users:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  audit:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  backup:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  cloud:'<path d="M18 10h-1.3A7 7 0 1 0 4 15.9"/><path d="M18 10a4 4 0 0 1 0 8h-6"/><path d="M9 13l3 3 3-3M12 16V9"/>',
  settings:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  menu:'<path d="M3 12h18M3 6h18M3 18h18"/>'
};
const ic = (n, c='w-5 h-5') => `<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||''}</svg>`;

/* ============ SHA-256 ============ */
function sha256Fallback(str) {
  const ascii0 = unescape(encodeURIComponent(str));
  const rr = (v,a) => (v>>>a)|(v<<(32-a));
  const mp = Math.pow, mw = mp(2,32);
  let ascii = ascii0, result = '';
  const words = [], bitLen = ascii0.length*8;
  let hash = [], k = [], pc = 0;
  const comp = {};
  for (let cand = 2; pc < 64; cand++) {
    if (!comp[cand]) {
      for (let i = 0; i < 313; i += cand) comp[i] = cand;
      hash[pc] = (mp(cand,.5)*mw)|0;
      k[pc++] = (mp(cand,1/3)*mw)|0;
    }
  }
  ascii += '\x80';
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (let i = 0; i < ascii.length; i++) {
    const j = ascii.charCodeAt(i);
    words[i>>2] |= j << ((3-i)%4)*8;
  }
  words[words.length] = ((bitLen/mw)|0);
  words[words.length] = bitLen;
  for (let j = 0; j < words.length;) {
    const w = words.slice(j, j+=16);
    const old = hash;
    hash = hash.slice(0,8);
    for (let i = 0; i < 64; i++) {
      const w15 = w[i-15], w2 = w[i-2];
      const a = hash[0], e = hash[4];
      const t1 = hash[7] + (rr(e,6)^rr(e,11)^rr(e,25)) + ((e&hash[5])^((~e)&hash[6])) + k[i] +
        (w[i] = (i<16) ? w[i] : (w[i-16] + (rr(w15,7)^rr(w15,18)^(w15>>>3)) + w[i-7] + (rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2 = (rr(a,2)^rr(a,13)^rr(a,22)) + ((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash = [(t1+t2)|0].concat(hash);
      hash[4] = (hash[4]+t1)|0;
    }
    for (let i = 0; i < 8; i++) hash[i] = (hash[i]+old[i])|0;
  }
  for (let i = 0; i < 8; i++) for (let j = 3; j+1; j--) { const b = (hash[i]>>(j*8))&255; result += ((b<16)?0:'') + b.toString(16); }
  return result;
}
async function sha256(str) {
  try {
    if (window.crypto && crypto.subtle) {
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
    }
  } catch(e) {}
  return sha256Fallback(str);
}
const hashPw = p => sha256('oilpos|' + String(p).trim());

/* ============ قاعدة البيانات ============ */
// اسم DB جديد لتجنب تعارض الإصدارات القديمة
const db = new Dexie('oilpos_v4');
db.version(1).stores({
  users:'++id,name,role',
  products:'++id,name,barcode',
  sales:'++id,invNo,date,shiftId,userId,customerId,status',
  purchases:'++id,date,supplierId,status',
  customers:'++id,name,phone',
  suppliers:'++id,name,phone',
  payments:'++id,entityId,entityType,date,shiftId',
  expenses:'++id,cat,date,shiftId',
  shifts:'++id,userId,openedAt,status',
  stockAdjustments:'++id,pid,date,shiftId,userId,type',
  auditLog:'++id,date,userId,action',
  settings:'k'
});
const gs = async (k, d=null) => { const r = await db.settings.get(k); return r ? r.v : d; };
const ss = (k, v) => db.settings.put({k, v});

/* ============ State ============ */
const S = {
  user:null, view:'pos', shift:null, cfg:{}, prods:[], pmap:{}, custs:[],
  cart:[], disc:{type:'amount',value:0}, method:'cash', custId:null, editing:null, editOld:null,
  q:'', paid:'', showHidden:false, pq:'',
  invRange:'today', invQ:'', expRange:'month', repRange:'today', repFrom:'', repTo:'', auditQ:'',
  adjRange:'month', adjPid:'',
  syncing:false,
  cloudSnap:null, cloudAt:null, cloudErr:null,
  viewerMode:false,
  aiHistory:[], aiBusy:false
};
const isMgr = () => S.user && S.user.role !== 'cashier';
const aiConfigured = () => !!(S.cfg.aiKey && S.cfg.aiModel && S.cfg.aiBaseUrl);
const cloudConfigured = () => !!(S.cfg.cloudUrl && S.cfg.cloudKey && S.cfg.shopId);

async function audit(action, details) {
  await db.auditLog.add({date:Date.now(), userId:S.user?S.user.id:null, action, details:details||''});
}
async function loadCfg() {
  S.cfg = {
    shopName: await gs('shopName','محل زيوت السيارات'),
    paperWidth: await gs('paperWidth','80'),
    phone: await gs('phone',''),
    address: await gs('address',''),
    footer: await gs('footer','شكراً لتعاملكم معنا'),
    allowNegative: !!(await gs('allowNegative',false)),
    cloudUrl: await gs('cloudUrl',''),
    cloudKey: await gs('cloudKey',''),
    shopId: await gs('shopId',''),
    autoUpload: !!(await gs('autoUpload', true)),
    lastUploadAt: await gs('lastUploadAt',0),
    lastUploadMsg: await gs('lastUploadMsg',''),
    aiProvider: await gs('aiProvider','groq'),
    aiBaseUrl: await gs('aiBaseUrl','https://api.groq.com/openai/v1'),
    aiKey: await gs('aiKey',''),
    aiModel: await gs('aiModel','openai/gpt-oss-120b')
  };
}
async function loadShift() {
  const open = await db.shifts.where('status').equals('open').toArray();
  open.sort((a,b) => a.openedAt - b.openedAt);
  S.shift = open[0] || null;
  S.openCount = open.length;
}
async function loadProducts() {
  S.prods = await db.products.toArray();
  S.pmap = Object.fromEntries(S.prods.map(p => [p.id, p]));
}
async function loadCustomers() {
  S.custs = (await db.customers.toArray()).sort((a,b) => a.name.localeCompare(b.name,'ar'));
}

/* ============ Seed ============ */
async function seed() {
  if ((await db.users.count()) === 0) {
    await db.users.bulkAdd([
      {name:'المبرمج', role:'dev', pin:await hashPw('0000'), active:true},
      {name:'المالك', role:'owner', pin:await hashPw('1111'), active:true},
      {name:'الكاشير', role:'cashier', pin:await hashPw('2222'), active:true}
    ]);
  }
  const ensure = async (k,v) => { if ((await gs(k)) === null) await ss(k,v); };
  await ensure('shopName','محل زيوت السيارات');
  await ensure('paperWidth','80');
  await ensure('discountPassHash', await hashPw('1234'));
  await ensure('deletePassHash', await hashPw('1234'));
  await ensure('invCounter', 0);
  await ensure('allowNegative', false);
  await ensure('autoUpload', true);
  await ensure('aiProvider','groq');
  await ensure('aiBaseUrl','https://api.groq.com/openai/v1');
  await ensure('aiModel','openai/gpt-oss-120b');
  // Shop ID افتراضي عشوائي
  if (!(await gs('shopId'))) await ss('shopId', 'oilshop-' + Math.random().toString(36).slice(2,8));
  if ((await gs('seeded')) === null) {

/* ============ Toast & Modals ============ */
function toast(msg, type='ok') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 3300);
}
const MODALS = [];
function showModal({title, body, footer='', size='md', onClose}) {
  const ov = document.createElement('div');
  ov.className = 'modal-ov fixed inset-0 z-[60] flex items-start sm:items-center justify-center p-3 overflow-y-auto';
  const w = {sm:'max-w-sm',md:'max-w-lg',lg:'max-w-3xl',xl:'max-w-5xl'}[size]||'max-w-lg';
  ov.innerHTML = `<div class="card w-full ${w} shadow-2xl my-auto">
    <div class="flex items-center justify-between px-4 py-3" style="border-bottom:1px solid var(--line)">
      <h3 class="font-extrabold text-lg">${esc(title)}</h3>
      <button class="btn btn-sec btn-sm" data-close>✕</button>
    </div>
    <div class="p-4 modal-body">${body}</div>
    ${footer?`<div class="px-4 py-3 flex flex-wrap gap-2 justify-end" style="border-top:1px solid var(--line)">${footer}</div>`:''}
  </div>`;
  let closed = false;
  const m = { el:ov, q:s=>$(s,ov),
    close(r) { if (closed) return; closed = true; const i = MODALS.indexOf(m); if (i>=0) MODALS.splice(i,1); ov.remove(); if (onClose) onClose(r); }
  };
  ov.addEventListener('mousedown', e => { if (e.target === ov) m.close(); });
  ov.querySelector('[data-close]').onclick = () => m.close();
  $('#modals').appendChild(ov);
  MODALS.push(m);
  return m;
}
document.addEventListener('keydown', e => { if (e.key==='Escape' && MODALS.length) MODALS[MODALS.length-1].close(); });
function confirmBox(msg, {title='تأكيد', ok='تأكيد', danger=false}={}) {
  return new Promise(res => {
    let r = false;
    const m = showModal({title, size:'sm',
      body:`<p style="white-space:pre-line;line-height:1.7">${esc(msg)}</p>`,
      footer:`<button class="btn btn-sec" data-no>إلغاء</button><button class="btn ${danger?'btn-dng':'btn-pri'}" data-yes>${esc(ok)}</button>`,
      onClose:()=>res(r)
    });
    m.q('[data-no]').onclick = () => m.close();
    m.q('[data-yes]').onclick = () => { r = true; m.close(); };
  });
}
function formModal({title, body, ok='حفظ', size='md', onSubmit, noEnter=false}) {
  const m = showModal({title, body, size,
    footer:`<button class="btn btn-sec" data-no>إلغاء</button><button class="btn btn-pri" data-ok>${esc(ok)}</button>`});
  m.q('[data-no]').onclick = () => m.close();
  const go = async () => {
    const b = m.q('[data-ok]');
    if (b.disabled) return;
    b.disabled = true;
    try { const r = await onSubmit(m); if (r !== false) m.close(); }
    catch(e) { toast(e.message||'خطأ','err'); console.error(e); }
    b.disabled = false;
  };
  m.q('[data-ok]').onclick = go;
  if (!noEnter) m.el.addEventListener('keydown', e => { if (e.key==='Enter' && e.target.tagName==='INPUT') { e.preventDefault(); go(); } });
  return m;
}
function askText({title, label, ok='حفظ'}) {
  return new Promise(res => {
    let val = null;
    const m = formModal({title, ok, size:'sm',
      body:`<label class="lbl">${esc(label)}</label><textarea id="at-v" class="inp" rows="3"></textarea>`,
      onSubmit: async mm => {
        const v = mm.q('#at-v').value.trim();
        if (!v) { toast('مطلوب','err'); return false; }
        val = v;
      }});
    const old = m.close;
    m.close = function(r){ old.call(m,r); res(val); };
  });
}

/* ============ verifyOp ============ */
async function verifyOp(kind, input) {
  const lockKey = 'lock_'+kind, attKey = 'att_'+kind;
  const lockUntil = await gs(lockKey, 0);
  if (lockUntil > Date.now()) {
    const mins = Math.ceil((lockUntil-Date.now())/60000);
    return {ok:false, msg:`مقفلة — حاول بعد ${mins} دقيقة`};
  }
  const stored = await gs(kind==='discount'?'discountPassHash':'deletePassHash');
  if ((await hashPw(input)) === stored) { await ss(attKey, 0); return {ok:true}; }
  let att = (await gs(attKey, 0)) + 1;
  await audit('wrong_op_pass', `محاولة خاطئة لباسوورد ${kind}`);
  if (att >= 5) { await ss(lockKey, Date.now()+5*60000); await ss(attKey, 0); return {ok:false, msg:'قُفلت 5 دقائق'}; }
  await ss(attKey, att);
  return {ok:false, msg:`غير صحيح (متبقي ${5-att})`};
}

/* ============ Shift ============ */
async function shiftSummary(sh) {
  const sales = (await db.sales.where('shiftId').equals(sh.id).toArray()).filter(s => s.status!=='deleted');
  const pays = (await db.payments.where('shiftId').equals(sh.id).toArray()).filter(p => p.entityType==='customer');
  const exps = await db.expenses.where('shiftId').equals(sh.id).toArray();
  const sum = (a,f) => r2(a.reduce((s,x)=>s+f(x),0));
  const cashSales = sum(sales.filter(s=>s.method==='cash'), s=>s.total);
  const creditSales = sum(sales.filter(s=>s.method==='credit'), s=>s.total);
  const discounts = sum(sales, s=>s.discount||0);
  const paymentsIn = sum(pays, p=>p.amount);
  const expOut = sum(exps, e=>e.amount);
  const expected = r2((sh.openingCash||0) + cashSales + paymentsIn - expOut);
  const byUser = {};
  sales.forEach(x => {
    const b = byUser[x.userId] = byUser[x.userId] || {count:0,cash:0,credit:0,total:0};
    b.count++; b[x.method==='cash'?'cash':'credit'] += x.total; b.total = r2(b.total + x.total);
  });
  return {byUser, sales, count:sales.length, cashSales, creditSales, discounts, paymentsIn, expOut, exps, expected, total:r2(cashSales+creditSales)};
}

async function buildSnapshot() {
  const snap = {exportedAt:Date.now(), version:4, shopName:S.cfg.shopName};
  for (const t of db.tables) {
    if (t.name === 'settings') continue;
    snap[t.name] = await t.toArray();
  }
  return snap;
}
async function uploadSnapshot(silent=false) {
  if (!cloudConfigured()) { if(!silent) toast('لم تُضبط إعدادات السحابة','warn'); return false; }
  S.syncing = true; cloudChipUpdate();
  try {
    const snap = await buildSnapshot();
    const url = S.cfg.cloudUrl.replace(/\/+$/,'') + '/rest/v1/shop_snapshots';
    const res = await fetch(url, {
      method:'POST',
      headers:{
        'apikey':S.cfg.cloudKey,
        'Authorization':'Bearer '+S.cfg.cloudKey,
        'Content-Type':'application/json',
        'Prefer':'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify([{shop_id:S.cfg.shopId, data:snap, updated_at:new Date().toISOString()}])
    });
    if (!res.ok) throw new Error('HTTP '+res.status+' '+(await res.text()).slice(0,150));
    await ss('lastUploadAt', Date.now());
    await ss('lastUploadMsg', 'نجاح');
    S.cfg.lastUploadAt = Date.now(); S.cfg.lastUploadMsg = 'نجاح';
    if (!silent) toast('تم رفع البيانات ✓');
    return true;
  } catch(e) {
    console.error(e);
    await ss('lastUploadMsg', 'خطأ: '+e.message);
    S.cfg.lastUploadMsg = 'خطأ: '+e.message;
    if (!silent) toast('فشل: '+e.message, 'err');
    return false;
  } finally { S.syncing = false; cloudChipUpdate(); }
}
async function fetchCloudSnapshot(creds) {
  const url = creds.url.replace(/\/+$/,'') + `/rest/v1/shop_snapshots?shop_id=eq.${encodeURIComponent(creds.shopId)}&select=data,updated_at`;
  const res = await fetch(url, {
    headers:{'apikey':creds.key, 'Authorization':'Bearer '+creds.key}
  });
  if (res.status === 404) throw new Error('الجدول غير موجود — تأكد من تشغيل SQL في Supabase');
  if (!res.ok) throw new Error('HTTP '+res.status);
  const arr = await res.json();
  if (!arr.length) throw new Error('لا توجد بيانات مرفوعة بعد من جهاز المحل');
  return arr[0];
}
function cloudChipUpdate() {
  const el = $('#cloudChip'); if (!el) return;
  if (!cloudConfigured()) { el.className = 'badge hidden'; return; }
  el.className = 'badge b-ok hidden sm:inline-block';
  if (S.syncing) el.innerHTML = '☁️ جاري الرفع...';

async function buildAIContext() {

  const todaySales = allSales.filter(s=>s.date>=t0);
  const weekSales = allSales.filter(s=>s.date>=weekAgo);
  const prods = await db.products.toArray();
  const lowStock = prods.filter(p=>p.active && p.stockUnits<=p.lowStock);
  const debtors = (await db.customers.toArray()).filter(c=>c.balance>0).sort((a,b)=>b.balance-a.balance).slice(0,10);
  const creditors = (await db.suppliers.toArray()).filter(s=>s.balance>0).sort((a,b)=>b.balance-a.balance).slice(0,10);
  const todayExps = (await db.expenses.toArray()).filter(e=>e.date>=t0);
  const openShift = (await db.shifts.where('status').equals('open').toArray())[0];
  const byProd = {};
  weekSales.forEach(s => s.items.forEach(i => {

    byProd[i.pid].units += i.units; byProd[i.pid].total += i.total;
  }));
  const topProds = Object.values(byProd).sort((a,b)=>b.units-a.units).slice(0,5);
  const todayCash = todaySales.filter(s=>s.method==='cash').reduce((a,s)=>a+s.total,0);
  const todayCredit = todaySales.filter(s=>s.method==='credit').reduce((a,s)=>a+s.total,0);
  const todayCogs = todaySales.reduce((a,s)=>a+s.items.reduce((b,i)=>b+(i.cost||0)*i.units,0),0);
  const recentAdjs = (await db.stockAdjustments.toArray()).sort((a,b)=>b.date-a.date).slice(0,5);
  return `أنت مساعد ذكي لمحل "${S.cfg.shopName}" (زيوت سيارات في مصر).
- التاريخ: ${fdt(now)}
- أسلوبك: عربي مصري، مختصر، أرقام دقيقة.

**آخر 7 أيام:** ${money(weekSales.reduce((a,s)=>a+s.total,0))} ج.م من ${weekSales.length} فاتورة

**المخزون:** ${prods.filter(p=>p.active).length} صنف

**أفضل 5 مبيعاً:**
${topProds.map((p,i)=>`${i+1}. ${p.name}: ${r2(p.units)} وحدة = ${money(p.total)} ج.م`).join('\n')||'لا توجد'}

**مديونيات:**

${recentAdjs.map(a=>`- ${a.name}: ${a.before}→${a.after} (${a.reason})`).join('\n')||'لا يوجد'}

  const cfg = cfgOverride || S.cfg;

/* ============ POS ============ */
const unitsOf = l => l.qty * (l.mode==='carton' ? l.upc : 1);
const defPrice = (p,m) => m==='carton' ? (p.wholesalePrice>0?p.wholesalePrice:p.retailPrice) : p.retailPrice;
function resetCart() {
  S.cart = []; S.disc = {type:'amount', value:0}; S.method = 'cash'; S.custId = null;
  S.editing = null; S.editOld = null; S.paid = '';
}
function availFor(pid) {
  const p = S.pmap[pid];
  let a = p ? p.stockUnits : 0;
  if (S.editOld) S.editOld.items.forEach(i => { if (i.pid===pid) a += i.units; });
  return a;
}
const usedFor = pid => S.cart.filter(l => l.pid===pid).reduce((s,l)=>s+unitsOf(l), 0);
function stockGuard(pid) {
  if (S.cfg.allowNegative) return true;
  const a = availFor(pid), u = usedFor(pid);
  if (u > a+1e-9) { toast(`المتاح ${a} فقط`,'err'); return false; }
  return true;
}
function calcCart() {
  let sub = 0, cost = 0;
  S.cart.forEach(l => { const u = unitsOf(l); sub += r2(u*l.unitPrice); cost += u*(l.lastCost||0); });
  sub = r2(sub); cost = r2(cost);
  let d = S.disc.type==='percent' ? sub*num(S.disc.value)/100 : num(S.disc.value);
  d = r2(Math.min(Math.max(d,0), sub));
  return {sub, cost, disc:d, total:r2(sub-d)};
}

function renderGrid() {
  const g = $('#grid'); if (!g) return;
  const q = S.q.trim().toLowerCase();
  const list = S.prods.filter(p => p.active && (!q || p.name.toLowerCase().includes(q) || (p.barcode||'').toLowerCase().includes(q)));
  g.innerHTML = list.length ? list.map(p => {
    const out = p.stockUnits <= 0, low = !out && p.stockUnits <= p.lowStock;
    return `<button class="ptile ${out?'out':''}" onclick="addToCart(${p.id})">
      <span class="font-bold text-sm leading-snug">${esc(p.name)}</span>
      <span class="text-xs muted">${esc(p.size||'')}</span>
      <span class="mt-auto flex items-end justify-between w-full pt-1">

        <span class="badge ${out?'b-red':low?'b-amb':'b-ok'}">${out?'نفذ':'متاح '+p.stockUnits}</span>
      </span></button>`;
  }).join('') : `<div class="col-span-full empty">لا توجد أصناف</div>`;
}
function addToCart(pid) {
  const p = S.pmap[pid];
  if (!p || !p.active) return;
  let l = S.cart.find(x => x.pid===pid && x.mode==='unit');
  if (l) { l.qty += 1; if (!stockGuard(pid)) { l.qty -= 1; return; } }
  else {
    l = {pid, name:p.name, size:p.size||'', upc:p.unitsPerCarton||1, mode:'unit', qty:1, unitPrice:defPrice(p,'unit'), cost:p.avgCost||p.lastCost||0, lastCost:p.lastCost||0};
    S.cart.push(l);
    if (!stockGuard(pid)) { S.cart.pop(); return; }
  }
  renderCart();
}
function setMode(i, m) {
  const l = S.cart[i];
  if (!l || l.mode===m) return;
  if (m==='carton' && l.upc<=1) return toast('لا يوجد كرتونة','err');
  const old = {mode:l.mode, unitPrice:l.unitPrice};
  l.mode = m; l.unitPrice = defPrice(S.pmap[l.pid], m);
  if (!stockGuard(l.pid)) Object.assign(l, old);
  renderCart();
}
function setQty(i, v) {
  const l = S.cart[i]; if (!l) return;
  let q = Math.floor(num(v)); if (q < 1) q = 1;
  const o = l.qty; l.qty = q;
  if (!stockGuard(l.pid)) l.qty = o;
  renderCart();
}
const chQty = (i,d) => { const l = S.cart[i]; if (l) setQty(i, l.qty+d); };
function removeLine(i) { S.cart.splice(i,1); renderCart(); }
function clearCart() { resetCart(); renderCart(); }
function cancelEdit() { resetCart(); renderCart(); toast('تم إلغاء التعديل','warn'); }
function clearDisc() { S.disc = {type:'amount', value:0}; renderCart(); }

function openDiscount() {
  if (!S.cart.length) return toast('السلة فارغة','err');
  const c = calcCart();
  const maxD = r2(Math.max(0, c.sub-c.cost));
  const needPw = S.user.role === 'cashier';
  formModal({title:'خصم', ok:'تطبيق', size:'sm',
    body:`<div class="space-y-3">
      ${fld('النوع', `<select id="d-type" class="inp"><option value="percent">نسبة %</option><option value="amount">مبلغ ثابت</option></select>`)}
      ${fld('القيمة', ni('d-val','', 'step="any"'))}

      <p class="text-xs muted">${needPw?'لا يقل الإجمالي عن التكلفة.':`أقصى خصم: ${egp(maxD)}`}</p></div>`,
    onSubmit:async m=>{
      const type = m.q('#d-type').value, val = num(m.q('#d-val').value);
      if (val<=0) { toast('قيمة الخصم','err'); return false; }
      if (type==='percent' && val>100) { toast('النسبة > 100','err'); return false; }
      const amt = r2(type==='percent' ? c.sub*val/100 : val);
      if (amt > c.sub) { toast('الخصم أكبر','err'); return false; }
      if (amt > maxD+0.001) { toast('أقل من التكلفة','err'); return false; }
      if (needPw) { const r = await verifyOp('discount', m.q('#d-pw').value); if (!r.ok) { toast(r.msg,'err'); return false; } }
      S.disc = {type, value:val};
      await audit('discount', `خصم ${type==='percent'?val+'%':money(val)+' ج.م'}`);
      renderCart();
      toast('تم');
    }});
}

async function applySale(sale, sign) {
  for (const it of sale.items) {
    const p = await db.products.get(it.pid);
    if (p) await db.products.update(it.pid, {stockUnits:r4((p.stockUnits||0) - sign*it.units)});
  }
  if (sale.method==='credit' && sale.customerId) {
    const c = await db.customers.get(sale.customerId);
    if (c) await db.customers.update(c.id, {balance:r2((c.balance||0) + sign*sale.total)});
  }
}
async function checkStock(items) {
  if (S.cfg.allowNegative) return;
  const need = {};
  items.forEach(i => { need[i.pid] = (need[i.pid]||0) + i.units; });
  for (const pid in need) {
    const p = await db.products.get(+pid);
    if (!p) throw new Error('صنف غير موجود');
    if ((p.stockUnits||0) < need[pid]-1e-9) throw new Error(`المخزون غير كافٍ: ${p.name} (${p.stockUnits})`);
  }
}
async function shiftLocked(shiftId) { const sh = await db.shifts.get(shiftId); return !!sh && sh.status==='closed'; }
async function checkout() {
  if (!S.cart.length) return toast('السلة فارغة','err');
  const c = calcCart();
  if (S.method==='credit' && !S.custId) return toast('اختر العميل','err');
  if (S.user.role==='cashier') { const bad = S.cart.find(l=>l.unitPrice<(l.lastCost||0)); if (bad) return toast(`سعر ${bad.name} أقل من التكلفة`,'err'); }
  let reason = null;
  if (S.editing) { reason = await askText({title:'سبب التعديل', label:'السبب', ok:'حفظ'}); if (!reason) return; }
  const items = S.cart.map(l => ({
    pid:l.pid, name:l.name, size:l.size, mode:l.mode, qty:l.qty, upc:l.upc, units:unitsOf(l),
    unitPrice:l.unitPrice, cost:l.cost, lastCost:l.lastCost, total:r2(unitsOf(l)*l.unitPrice)
  }));
  const fields = {items, subTotal:c.sub, discount:c.disc, discountType:S.disc.type, discountValue:num(S.disc.value), total:c.total, method:S.method, customerId:S.method==='credit'?S.custId:null};
  let saved = null;
  try {
    await db.transaction('rw', db.sales, db.products, db.customers, db.settings, db.auditLog, db.shifts, async () => {
      if (S.editing) {
        const old = await db.sales.get(S.editing);
        if (!old || old.status==='deleted') throw new Error('غير متاحة');
        if (await shiftLocked(old.shiftId)) throw new Error('وردية مقفلة');
        await applySale(old, -1);
        await checkStock(items);
        await applySale(fields, 1);
        const upd = {...fields, editReason:reason, editedAt:Date.now()};
        await db.sales.update(old.id, upd);
        saved = {...old, ...upd};
        await db.auditLog.add({date:Date.now(), userId:S.user.id, action:'edit_sale', details:`تعديل ${old.invNo}: ${reason}`});
      } else {
        const cur = await db.shifts.get(S.shift.id);
        if (!cur || cur.status!=='open') throw new Error('الوردية أُغلقت');
        await checkStock(items);
        await applySale(fields, 1);
        const n = (await gs('invCounter',0)) + 1;
        await ss('invCounter', n);
        const sale = {...fields, invNo:'INV-'+String(n).padStart(6,'0'), date:Date.now(), shiftId:S.shift.id, userId:S.user.id, status:'active', editReason:''};
        sale.id = await db.sales.add(sale);
        saved = sale;
        await db.auditLog.add({date:Date.now(), userId:S.user.id, action:'sale', details:`فاتورة ${sale.invNo} بقيمة ${money(sale.total)}`});
      }
    });
  } catch(e) { console.error(e); return toast(e.message||'فشل الحفظ','err'); }
  const wasEdit = !!S.editing;
  resetCart();
  await loadProducts(); await loadCustomers();
  renderGrid(); renderCart();
  saleDone(saved, wasEdit);
}
function saleDone(sale, wasEdit) {
  const m = showModal({title: wasEdit?'تم حفظ التعديل':'تمت العملية', size:'sm',
    body:`<div class="text-center py-2"><div class="muted text-sm">فاتورة</div><div class="font-extrabold text-lg">${esc(sale.invNo)}</div>
      <div class="totalbox mt-3 justify-center"><strong>${money(sale.total)}</strong><small>ج.م</small></div>
      <div class="mt-2 text-sm muted">${sale.method==='cash'?'كاش':'آجل'}</div></div>`,
    footer:`<button class="btn btn-sec" data-print>طباعة</button><button class="btn btn-pri" data-new>جديدة</button>`});
  m.q('[data-print]').onclick = () => printSale(sale.id);
  m.q('[data-new]').onclick = () => { m.close(); const q = $('#pos-q'); if (q) q.focus(); };
}

async function openShift() {
  if (S.user.role!=='cashier') return toast('للكاشير فقط','err');
  const v = num($('#sh-open').value);
  if ($('#sh-open').value.trim()==='' || v<0) return toast('أدخل الرصيد','err');
  await loadShift();
  if (S.shift) { const o = await db.users.get(S.shift.userId); return toast(`وردية مفتوحة (${o?o.name:''})`,'err'); }
  const id = await db.shifts.add({userId:S.user.id, openedAt:Date.now(), closedAt:null, closedBy:null, openingCash:r2(v), countedCash:null, expectedCash:null, diff:null, status:'open'});
  await audit('open_shift', `فتح #${id} برصيد ${money(v)}`);
  await loadShift(); refreshHeader();
  toast('تم'); await go('pos');
}
function closeShiftModal() {
  if (!S.shift || S.user.role!=='cashier') return;
  formModal({title:'إغلاق الوردية', ok:'تأكيد',
    body:`<p class="text-sm muted mb-3">عُدّ النقدية الفعلية.</p>${fld('المبلغ الفعلي', ni('cs-v','', 'placeholder="0"'))}`,
    onSubmit:async m=>{
      const raw = m.q('#cs-v').value;
      if (raw.trim()==='' || num(raw)<0) { toast('أدخل المبلغ','err'); return false; }
      const counted = r2(num(raw));
      const sh = S.shift;
      const s = await shiftSummary(sh);
      const diff = r2(counted - s.expected);
      await db.transaction('rw', db.shifts, db.auditLog, async () => {
        const cur = await db.shifts.get(sh.id);
        if (!cur || cur.status!=='open') throw new Error('مغلقة');
        await db.shifts.update(sh.id, {closedAt:Date.now(), closedBy:S.user.id, countedCash:counted, expectedCash:s.expected, diff, status:'closed'});
        await db.auditLog.add({date:Date.now(), userId:S.user.id, action:'close_shift', details:`إغلاق #${sh.id} — متوقع ${money(s.expected)} فعلي ${money(counted)} فرق ${money(diff)}`});
      });
      const id = sh.id;
      S.shift = null; resetCart(); refreshHeader();
      toast('تم'); await go('shift'); await printZ(id);
    }});
}

/* Stock Adjustment */
function adjustStock(id) {
  const p = S.pmap[id], upc = p.unitsPerCarton || 1;
  formModal({title:`جرد: ${p.name}`, size:'md', ok:'اعتماد',
    body:`<div class="space-y-3">
      <div class="p-3 rounded-lg text-sm" style="background:#f6f8fb">الرصيد الحالي: <b>${p.stockUnits}</b> جركن • متوسط التكلفة: <b>${money(p.avgCost||0)}</b></div>
      <div class="grid grid-cols-2 gap-3">
        ${upc>1?fld('كراتين', ni('ad-c','', 'min="0" placeholder="0"')):''}
        ${fld(upc>1?'جراكن فرط':'الكمية الفعلية', ni('ad-u','', 'min="0" placeholder="0"'))}
      </div>
      ${fld('النوع', `<select id="ad-t" class="inp"><option value="shortage">عجز</option><option value="surplus">زيادة</option><option value="correction">تصحيح</option></select>`)}
      ${fld('السبب', `<select id="ad-r" class="inp"><option>تلف/تكسير</option><option>سرقة/فقد</option><option>خطأ إدخال</option><option>مرتجع</option><option>جرد دوري</option><option>أخرى</option></select>`)}
      ${fld('ملاحظة', `<input id="ad-n" class="inp">`)}
      <p id="ad-preview" class="text-sm font-bold" style="color:var(--amberd)"></p>
    </div>`,
    onSubmit:async m=>{
      const cIn = m.q('#ad-c'), c = cIn ? Math.floor(num(cIn.value)) : 0;
      const total = c*upc + num(m.q('#ad-u').value);
      if (total<0) { toast('كمية غير صحيحة','err'); return false; }
      const before = p.stockUnits;
      const diff = r2(total - before);
      if (diff===0) { toast('مطابق بالفعل','warn'); return false; }
      const type = m.q('#ad-t').value;
      const costValue = r2(Math.abs(diff) * (p.avgCost||0));
      await db.transaction('rw', db.products, db.stockAdjustments, db.auditLog, async () => {
        await db.products.update(id, {stockUnits:total});
        await db.stockAdjustments.add({pid:id, name:p.name, before, after:total, diff, unitCost:p.avgCost||0, costValue, type, reason:m.q('#ad-r').value, note:m.q('#ad-n').value.trim(), date:Date.now(), userId:S.user.id, shiftId:S.shift?S.shift.id:null});
        await db.auditLog.add({date:Date.now(), userId:S.user.id, action:'stock_adjust', details:`جرد ${p.name}: ${before} → ${total} قيمة ${money(costValue)}`});
      });
      toast(`تم — ${diff>0?'زيادة':'عجز'} ${egp(costValue)}`);
      VIEWS.products();
    }});
  const upd = () => {
    const fm = MODALS[MODALS.length-1]; if (!fm) return;
    const c = Math.floor(num(fm.q('#ad-c') ? fm.q('#ad-c').value : 0));
    const total = c*upc + num(fm.q('#ad-u').value);
    const diff = r2(total - p.stockUnits);
    const val = r2(Math.abs(diff) * (p.avgCost||0));
    fm.q('#ad-preview').textContent = diff===0 ? 'لا فرق' : `${diff>0?'زيادة':'عجز'} ${Math.abs(diff)} = ${egp(val)}`;
  };
  setTimeout(()=>{ const fm = MODALS[MODALS.length-1]; if (!fm) return; ['#ad-c','#ad-u'].forEach(s=>{ const el = fm.q(s); if (el) el.addEventListener('input', upd); }); }, 50);
}

      <div class="card stat"><div class="k">إجمالي الزيادة</div><div class="v" style="color:var(--green)">${egp(totalSurp)}</div></div>

    <div class="p-3 rounded-lg text-xs mb-3" style="background:#f6f8fb;color:var(--muted)">💡 العجز يُحسب كخسارة في التقارير.</div>
    ${tbl(['التاريخ','الصنف','الرصيد','الفرق','تكلفة الوحدة','القيمة','النوع','السبب','المستخدم',''],rows,'لا تسويات')}`;

async function revertAdj(id) {
  const a = await db.stockAdjustments.get(id); if (!a) return;
  if (!(await confirmBox(`عكس جرد ${a.name}؟\nمن ${a.after} → ${a.before}`, {danger:true, ok:'عكس'}))) return;
  try {
    await db.transaction('rw', db.products, db.stockAdjustments, db.auditLog, async () => {
      const p = await db.products.get(a.pid);
      if (!p) throw new Error('الصنف محذوف');
      await db.products.update(a.pid, {stockUnits:a.before});
      await db.stockAdjustments.delete(id);
      await db.auditLog.add({date:Date.now(), userId:S.user.id, action:'revert_stock_adjust', details:`عكس جرد ${a.name}`});
    });
    toast('تم'); VIEWS.stockAdj();
  } catch(e) { toast(e.message,'err'); }
}

async function applyPurchaseItems(items) {
  for (const it of items) {
    const p = await db.products.get(it.pid);
    if (!p) throw new Error('غير موجود: '+it.name);
    const base = Math.max(p.stockUnits||0, 0);
    const avg = (base*(p.avgCost||0) + it.units*it.unitCost) / (base+it.units);
    await db.products.update(p.id, {stockUnits:r4((p.stockUnits||0)+it.units), lastCost:r4(it.unitCost), avgCost:r4(avg)});
  }
}
async function reversePurchase(old) {
  const others = (await db.purchases.toArray()).filter(x=>x.id!==old.id && x.status!=='cancelled').sort((a,b)=>b.date-a.date);
  for (const it of old.items) {
    const p = await db.products.get(it.pid); if (!p) continue;
    const remain = (p.stockUnits||0) - it.units;
    let avg = p.avgCost||0, last = p.lastCost||0;
    if (remain>0) { const a = ((p.stockUnits||0)*avg - it.units*it.unitCost)/remain; if (a>0) avg = a; }
    const prev = others.find(x=>x.items.some(i=>i.pid===it.pid));
    if (prev && old.date>=prev.date) last = prev.items.filter(i=>i.pid===it.pid).pop().unitCost;
    await db.products.update(p.id, {stockUnits:r4(remain), avgCost:r4(avg), lastCost:r4(last)});
  }
  if (old.due>0) { const sp = await db.suppliers.get(old.supplierId); if (sp) await db.suppliers.update(sp.id, {balance:r2((sp.balance||0)-old.due)}); }
}
async function deletePurchase(id) {
  const first = await db.purchases.get(id);
  if (!first || first.status==='cancelled') return toast('غير متاحة','err');
  const reason = await askText({title:`حذف شراء #${id}`, label:'السبب', ok:'حذف'});
  if (!reason) return;
  try {
    await db.transaction('rw', db.purchases, db.products, db.suppliers, db.auditLog, async () => {
      const cur = await db.purchases.get(id);
      if (!cur || cur.status==='cancelled') throw new Error('ملغاة');
      await reversePurchase(cur);
      await db.purchases.update(id, {status:'cancelled', cancelReason:reason, cancelledAt:Date.now()});
      await db.auditLog.add({date:Date.now(), userId:S.user.id, action:'del_purchase', details:`حذف شراء #${id}`});
    });
  } catch(e) { return toast(e.message,'err'); }
  toast('تم'); VIEWS.purchases();
}
async function newPurchase(editId=null) {
  await loadProducts();
  const old = editId ? await db.purchases.get(editId) : null;
  if (editId && (!old || old.status==='cancelled')) return toast('غير متاحة','err');
  const sups = await db.suppliers.toArray();
  const usedIds = old ? old.items.map(i=>i.pid) : [];
  const prods = S.prods.filter(p=>p.active || usedIds.includes(p.id));
  if (!sups.length) return toast('أضف مورداً','err');
  if (!prods.length) return toast('لا أصناف','err');
  const D = {items: old ? old.items.map(i=>({pid:String(i.pid), cartons:i.cartons||'', loose:i.loose||'', cost:i.cartonCost})) : [{pid:'',cartons:'',loose:'',cost:''}]};
  const lineCalc = it => { const p = S.pmap[+it.pid]; if (!p) return {units:0,total:0}; const upc = p.unitsPerCarton||1; const units = num(it.cartons)*upc+num(it.loose); return {units, total:r2(units*num(it.cost)/upc)}; };
  const m = formModal({title: old?`تعديل شراء #${editId}`:'شراء جديد', size:'xl', ok: old?'حفظ':'حفظ الفاتورة', noEnter:true,
    body:`<div class="grid sm:grid-cols-2 gap-3 mb-3">
        ${fld('المورد', `<select id="pu-sup" class="inp">${sups.map(s=>`<option value="${s.id}" ${old&&old.supplierId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`)}
        ${fld('التاريخ', `<input id="pu-date" type="date" class="inp" value="${toInputDate(old?old.date:Date.now())}">`)}</div>
      <div id="pu-rows" class="space-y-2"></div>
      <button class="btn btn-sec btn-sm mt-2" id="pu-add">+ صنف</button>
      <div class="grid sm:grid-cols-3 gap-3 mt-4 items-end">
        <div><div class="lbl">الإجمالي</div><div id="pu-total" class="text-xl font-extrabold">0 ج.م</div></div>
        ${fld('المدفوع', ni('pu-paid', old?old.paid:''))}
        <div><div class="lbl">المتبقي</div><div id="pu-due" class="text-xl font-extrabold" style="color:var(--red)">0 ج.م</div></div></div>
      <div class="flex gap-2 mt-2"><button class="btn btn-sec btn-sm" id="pu-full">سداد كامل</button><button class="btn btn-sec btn-sm" id="pu-credit">آجل</button></div>`,
    onSubmit:async mm=>{
      const items = [];
      for (const it of D.items) {
        if (!it.pid && !num(it.cartons) && !num(it.loose) && !num(it.cost)) continue;
        const p = S.pmap[+it.pid];
        if (!p) { toast('اختر الصنف','err'); return false; }
        const lc = lineCalc(it);
        if (lc.units<=0) { toast('كمية غير صحيحة','err'); return false; }
        if (num(it.cost)<=0) { toast('تكلفة غير صحيحة','err'); return false; }
        const upc = p.unitsPerCarton||1;
        items.push({pid:p.id, name:p.name, size:p.size||'', upc, cartons:num(it.cartons), loose:num(it.loose), cartonCost:num(it.cost), units:lc.units, unitCost:num(it.cost)/upc, total:lc.total});
      }
      if (!items.length) { toast('أضف صنفاً','err'); return false; }
      const total = r2(items.reduce((s,i)=>s+i.total,0));
      const paidIn = num(mm.q('#pu-paid').value);
      if (paidIn>total+0.001) { toast('المدفوع أكبر','err'); return false; }
      const paid = r2(Math.max(paidIn,0)), due = r2(total-paid);
      const supId = +mm.q('#pu-sup').value;
      const dv = mm.q('#pu-date').value;
      let d;
      if (old && dv===toInputDate(old.date)) d = old.date;
      else { d = fromInputDate(dv); d = sod(d)===sod(Date.now()) ? Date.now() : d+12*3600000; }
      const method = due===0?'cash':paid===0?'credit':'partial';
      await db.transaction('rw', db.purchases, db.products, db.suppliers, db.auditLog, async () => {
        let cur = null;
        if (editId) { cur = await db.purchases.get(editId); if (!cur || cur.status==='cancelled') throw new Error('غير متاحة'); await reversePurchase(cur); }
        await applyPurchaseItems(items);
        if (due>0) { const sp = await db.suppliers.get(supId); await db.suppliers.update(supId, {balance:r2((sp.balance||0)+due)}); }
        const rec = {date:d, supplierId:supId, items, total, paid, due, method, status:'active', userId:S.user.id};
        if (cur) { await db.purchases.update(editId, {...rec, userId:cur.userId, editedAt:Date.now()}); await audit('edit_purchase', `تعديل شراء #${editId}`); }
        else { const id = await db.purchases.add(rec); await audit('purchase', `شراء #${id} بقيمة ${money(total)}`); }
      });
      toast('تم'); VIEWS.purchases();
    }});
  const rowsEl = m.q('#pu-rows');
  const totals = () => { const t = r2(D.items.reduce((s,it)=>s+lineCalc(it).total,0)); m.q('#pu-total').textContent = egp(t); m.q('#pu-due').textContent = egp(Math.max(t-Math.min(num(m.q('#pu-paid').value),t),0)); return t; };
  const lineLabel = it => { const c = lineCalc(it); return c.units ? `${c.units} جركن = ${money(c.total)}` : '-'; };
  const draw = () => {
    rowsEl.innerHTML = D.items.map((it,i)=>`<div class="grid grid-cols-2 md:grid-cols-[2.2fr_1fr_1fr_1.2fr_1.4fr_auto] gap-2 items-end p-2 rounded-lg" style="border:1px solid var(--line)" data-i="${i}">

      <div><label class="lbl">كراتين</label><input data-f="cartons" type="number" min="0" step="any" class="inp" value="${esc(it.cartons)}"></div>

    totals();

    const pl = $('#pl-'+i, m.el); if (pl) pl.textContent = lineLabel(D.items[i]);

  });
  rowsEl.addEventListener('click', e => {
    const b = e.target.closest('[data-rm]'); if (!b) return;
    if (D.items.length>1) D.items.splice(+b.dataset.rm,1); else D.items = [{pid:'',cartons:'',loose:'',cost:''}];
    draw();
  });
  m.q('#pu-add').onclick = () => { D.items.push({pid:'',cartons:'',loose:'',cost:''}); draw(); };
  m.q('#pu-paid').oninput = totals;
  m.q('#pu-full').onclick = () => { m.q('#pu-paid').value = totals(); totals(); };
  m.q('#pu-credit').onclick = () => { m.q('#pu-paid').value = 0; totals(); };
  draw();
}

  if (!(await confirmBox(`حذف ${money(p.amount)} ج.م؟`, {danger:true, ok:'حذف'}))) return;
  try {
    await db.transaction('rw', db.payments, db.customers, db.suppliers, db.shifts, db.auditLog, async () => {

async function partyStatement(kind, id) {
  const P = PARTY[kind], x = await P.tbl().get(id);
  const pays = (await db.payments.where('entityId').equals(id).toArray()).filter(p=>p.entityType===kind);
  let ev = pays.map(p=>({date:p.date, desc:`دفعة ${kind==='customer'?'مستلمة':'مسددة'}${p.note?' - '+p.note:''}`, inc:0, dec:p.amount}));
  if (kind==='customer') {
    const sales = (await db.sales.where('customerId').equals(id).toArray()).filter(s=>s.status!=='deleted' && s.method==='credit');
    ev = ev.concat(sales.map(s=>({date:s.date, desc:`فاتورة ${s.invNo}`, inc:s.total, dec:0})));
  } else {
    const pu = (await db.purchases.where('supplierId').equals(id).toArray());
    ev = ev.concat(pu.filter(p=>p.due>0 && p.status!=='cancelled').map(p=>({date:p.date, desc:`شراء #${p.id}`, inc:p.due, dec:0})));
  }
  ev.sort((a,b)=>a.date-b.date);
  const opening = r2((x.balance||0) - ev.reduce((s,e)=>s+e.inc-e.dec,0));
  let run = opening;
  const rowsArr = [];
  if (opening!==0) rowsArr.push(`<tr><td>-</td><td>رصيد سابق</td><td></td><td></td><td>${money(opening)}</td></tr>`);
  ev.forEach(e => { run = r2(run+e.inc-e.dec); rowsArr.push(`<tr><td>${fdt(e.date)}</td><td>${esc(e.desc)}</td><td>${e.inc?money(e.inc):''}</td><td>${e.dec?money(e.dec):''}</td><td><b>${money(run)}</b></td></tr>`); });
  const table = `<table class="tbl"><thead><tr><th>التاريخ</th><th>البيان</th><th>له</th><th>دفعات</th><th>الرصيد</th></tr></thead><tbody>${rowsArr.join('')||'<tr><td colspan="5" class="empty">لا حركات</td></tr>'}</tbody></table>`;
  const m = showModal({title:`كشف: ${x.name}`, size:'xl',
    body:`<div class="flex justify-between mb-3 text-sm"><span>${esc(x.phone||'')}</span><span>الرصيد: <b>${egp(x.balance)}</b></span></div><div class="overflow-x-auto">${table}</div>`,
    footer:'<button class="btn btn-sec" data-p>طباعة</button>'});
  m.q('[data-p]').onclick = () => printHTML(`<div dir="rtl"><h2 style="text-align:center">${esc(S.cfg.shopName)}</h2><h3 style="text-align:center">كشف: ${esc(x.name)} - ${fdate(Date.now())}</h3>${table.replace('class="tbl"','')}<p style="margin-top:8px;font-weight:800">الرصيد: ${egp(x.balance)}</p></div>`, true);
}

function rangeFor(k) {
  const t0 = sod(Date.now());
  if (k==='today') return [t0, addDays(t0,1)];
  if (k==='yesterday') return [addDays(t0,-1), t0];
  if (k==='week') return [addDays(t0,-6), addDays(t0,1)];
  if (k==='month') { const d = new Date(t0); d.setDate(1); return [d.getTime(), addDays(t0,1)]; }
  return [t0, addDays(t0,1)];
}

/* ============ Reports ============ */
VIEWS.reports = async function () {
  let f, t;
  if (S.repRange==='custom') { f = fromInputDate(S.repFrom||toInputDate(Date.now())); t = addDays(fromInputDate(S.repTo||toInputDate(Date.now())),1); }
  else [f,t] = rangeFor(S.repRange);
  const sales = (await db.sales.where('date').between(f,t,true,false).toArray()).filter(s=>s.status!=='deleted');
  const exps = await db.expenses.where('date').between(f,t,true,false).toArray();
  const adjs = await db.stockAdjustments.where('date').between(f,t,true,false).toArray();
  const sum = (a,fn) => r2(a.reduce((s,x)=>s+fn(x),0));
  const total = sum(sales, s=>s.total), disc = sum(sales, s=>s.discount||0);
  const cogs = r2(sales.reduce((s,x)=>s+x.items.reduce((a,i)=>a+(i.cost||0)*i.units,0),0));
  const expTotal = sum(exps, e=>e.amount);
  const adjShort = sum(adjs.filter(a=>a.diff<0), a=>a.costValue);
  const adjSurp = sum(adjs.filter(a=>a.diff>0), a=>a.costValue);
  const adjNet = r2(adjShort-adjSurp);
  const net = r2(total-cogs-expTotal-adjNet);
  const cash = sum(sales.filter(s=>s.method==='cash'), s=>s.total), credit = sum(sales.filter(s=>s.method==='credit'), s=>s.total);
  const agg = {};
  sales.forEach(s => { const ratio = s.subTotal>0 ? s.total/s.subTotal : 1;
    s.items.forEach(i => { const a = agg[i.pid] = agg[i.pid] || {name:i.name+(i.size?' - '+i.size:''), units:0, rev:0, profit:0};
      a.units += i.units; a.rev += i.total*ratio; a.profit += i.total*ratio - (i.cost||0)*i.units; });
  });
  const top = Object.values(agg).sort((a,b)=>b.units-a.units).slice(0,10);
  await loadProducts();
  const lows = S.prods.filter(p=>p.active && p.stockUnits<=p.lowStock).sort((a,b)=>a.stockUnits-b.stockUnits);
  const cards = [
    ['المبيعات', egp(total), `${sales.length} فاتورة`],
    ['الخصومات', egp(disc), ''],
    ['تكلفة البضاعة', egp(cogs), ''],
    ['المصاريف', egp(expTotal), `${exps.length} مصروف`],
    ['خسائر الجرد', egp(adjShort), ''],
    ['زيادة الجرد', egp(adjSurp), 'تُخصم'],
    ['كاش', egp(cash), ''],
    ['آجل', egp(credit), '']
  ];

function renderAIChat() {
  const box = $('#ai-chat'); if (!box) return;
  if (!S.aiHistory.length) {
    box.innerHTML = '<div class="text-center muted py-8">ابدأ بأي سؤال.</div>';
    return;
  }
  box.innerHTML = S.aiHistory.map(m => {
    const me = m.role==='user';
    return `<div class="flex ${me?'justify-end':'justify-start'}"><div class="${me?'chat-me':'chat-bot'}">
      <div class="text-xs font-bold mb-1 ${me?'opacity-70':'muted'}">${me?'أنت':'🤖 المساعد'}</div>${esc(m.content)}</div></div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}
async function aiAsk(q) {
  if (!aiConfigured()) return toast('ضبط الـ AI أولاً من الإعدادات','err');
  if (S.aiBusy) return;
  S.aiBusy = true;
  const inp = $('#ai-in');
  if (inp) inp.value = '';
  S.aiHistory.push({role:'user', content:q});
  renderAIChat();
  const box = $('#ai-chat');
  box.insertAdjacentHTML('beforeend', '<div id="ai-loading" class="flex justify-start"><div class="chat-bot">🤖 بيفكر...</div></div>');
  box.scrollTop = box.scrollHeight;
  try {
    const ans = await aiChat(q, S.aiHistory.slice(0,-1));
    const ld = $('#ai-loading'); if (ld) ld.remove();
    S.aiHistory.push({role:'assistant', content:ans});
    renderAIChat();
  } catch(e) {
    const ld = $('#ai-loading'); if (ld) ld.remove();
    S.aiHistory.push({role:'assistant', content:'⚠️ خطأ: '+e.message});
    renderAIChat();

  $('#view').innerHTML = `<div class="grid gap-4 md:grid-cols-2 max-w-4xl">

  $('#bk-file').onchange = e => importBackup(e.target.files[0]);

async function exportBackup() {
  const data = {};
  for (const t of db.tables) data[t.name] = await t.toArray();
  const blob = new Blob([JSON.stringify({app:'OilPOS', version:4, exportedAt:Date.now(), data})], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `oilpos-backup-${toInputDate(Date.now())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  await audit('backup', 'تصدير نسخة');
  toast('تم');
}
async function importBackup(file) {
  if (!file) return;
  let parsed;
  try { parsed = JSON.parse(await file.text()); } catch(e) { return toast('ملف غير صالح','err'); }
  if (!parsed || parsed.app!=='OilPOS' || !parsed.data) return toast('ليس ملف OilPOS','err');
  if (!(await confirmBox('سيتم استبدال كل البيانات. متأكد؟', {danger:true, ok:'استرجاع'}))) return;
  try {
    await db.transaction('rw', db.tables, async () => {
      for (const t of db.tables) { await t.clear(); const rows = parsed.data[t.name]; if (rows && rows.length) await t.bulkPut(rows); }
    });
  } catch(e) { return toast('فشل: '+e.message,'err'); }
  toast('تم — إعادة تحميل');
  setTimeout(()=>location.reload(), 1200);
}

  await ss('address', $('#st-a').value.trim());
  await ss('footer', $('#st-f').value.trim());
  await ss('allowNegative', $('#st-neg').checked);
  await ss('cloudUrl', cloudUrl);
  await ss('cloudKey', $('#st-ck').value.trim());
  await ss('shopId', $('#st-cs').value.trim());
  await ss('autoUpload', $('#st-ca').checked);
  await ss('aiProvider', $('#st-aip').value);
  await ss('aiBaseUrl', $('#st-aib').value.trim());
  await ss('aiKey', $('#st-aik').value.trim());
  await ss('aiModel', $('#st-aim').value.trim());
  await audit('settings', 'تحديث الإعدادات');

}
async function uploadNow() {
  if (!cloudConfigured()) return toast('أدخل URL و Key و Shop ID أولاً','err');
  await uploadSnapshot(false);
  VIEWS.settings();
}
async function testCloudNow() {
  const url = $('#st-cu').value.trim().replace(/\/+$/,'').replace(/\/rest\/v1$/,'');
  const key = $('#st-ck').value.trim();
  const sid = $('#st-cs').value.trim();
  if (!url || !key || !sid) return toast('املأ الحقول الثلاثة','err');
  try {
    const r = await fetch(url + `/rest/v1/shop_snapshots?shop_id=eq.${encodeURIComponent(sid)}&select=updated_at&limit=1`, {
      headers:{'apikey':key, 'Authorization':'Bearer '+key}
    });
    if (r.status === 404) return toast('الجدول غير موجود — شغّل SQL في Supabase','err');
    if (!r.ok) throw new Error('HTTP '+r.status);
    toast('الاتصال يعمل ✓');
  } catch(e) { toast('فشل: '+e.message,'err'); }
}
async function testAInow() {
  const key = $('#st-aik').value.trim(), model = $('#st-aim').value.trim(), base = $('#st-aib').value.trim();
  if (!key || !model || !base) return toast('املأ الحقول الثلاثة','err');
  try {
    const res = await fetch(base.replace(/\/+$/,'') + '/chat/completions', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model, messages:[{role:'user',content:'قل: تمام'}], max_tokens:10})
    });
    if (!res.ok) { const t = await res.text(); return toast('فشل: '+res.status+' — '+t.slice(0,120),'err'); }
    const d = await res.json();
    toast('✓ AI يعمل — الرد: '+(d.choices?.[0]?.message?.content||'').slice(0,40));
  } catch(e) { toast('فشل: '+e.message,'err'); }
}

/* ============ Init ============ */
(async function init() {
  try {
    if (typeof Dexie === 'undefined') throw new Error('تعذر تحميل مكتبة Dexie. تأكد من الاتصال بالإنترنت.');
    await seed();
    await loadCfg();
    let uid = null;
    try { uid = sessionStorage.getItem('oilpos_uid'); } catch(e) {}
    if (uid) {
      const u = await db.users.get(+uid);
      if (u && u.active) { S.user = u; await boot(); return; }
    }
    await renderLogin();
  } catch(e) {
    console.error(e);
    document.body.insertAdjacentHTML('afterbegin', `<div style="padding:2rem;text-align:center;font-weight:700;color:#c23b2a">${esc(e.message)}</div>`);
  }
})();
</script>
