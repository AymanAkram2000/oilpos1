function setRep(k) { S.repRange = k; VIEWS.reports(); }
function applyCustom() { S.repFrom = $('#rp-from').value; S.repTo = $('#rp-to').value; S.repRange = 'custom'; VIEWS.reports(); }
VIEWS.reports = async function () {
  let f, t;
  if (S.repRange === 'custom') { f = fromInputDate(S.repFrom || toInputDate(Date.now())); t = addDays(fromInputDate(S.repTo || toInputDate(Date.now())), 1); }
  else [f, t] = rangeFor(S.repRange);
  const sales = (await db.sales.where('date').between(f, t, true, false).toArray()).filter(s => s.status !== 'deleted');
  const exps = await db.expenses.where('date').between(f, t, true, false).toArray();
  const adjs = await db.stockAdjustments.where('date').between(f, t, true, false).toArray();
  const sum = (a, fn) => r2(a.reduce((s, x) => s + fn(x), 0));
  const total = sum(sales, s => s.total), disc = sum(sales, s => s.discount || 0);
  const cogs = r2(sales.reduce((s, x) => s + x.items.reduce((a, i) => a + (i.cost || 0) * i.units, 0), 0));
  const expTotal = sum(exps, e => e.amount);
  const adjShort = sum(adjs.filter(a => a.diff < 0), a => a.costValue);
  const adjSurp = sum(adjs.filter(a => a.diff > 0), a => a.costValue);
  const adjNet = r2(adjShort - adjSurp);
  const net = r2(total - cogs - expTotal - adjNet);
  const cash = sum(sales.filter(s => s.method === 'cash'), s => s.total), credit = sum(sales.filter(s => s.method === 'credit'), s => s.total);
  const agg = {};
  sales.forEach(s => {
    const ratio = s.subTotal > 0 ? s.total / s.subTotal : 1;
    s.items.forEach(i => {
      const a = agg[i.pid] = agg[i.pid] || {name: i.name + (i.size ? ' - ' + i.size : ''), units: 0, rev: 0, profit: 0};
      a.units += i.units; a.rev += i.total * ratio; a.profit += i.total * ratio - (i.cost || 0) * i.units;
    });
  });
  const top = Object.values(agg).sort((a, b) => b.units - a.units).slice(0, 10);
  await loadProducts();
  const lows = S.prods.filter(p => p.active && p.stockUnits <= p.lowStock).sort((a, b) => a.stockUnits - b.stockUnits);
  const cards = [
    ['إجمالي المبيعات', egp(total), `${sales.length} فاتورة`],
    ['الخصومات', egp(disc), ''],
    ['تكلفة البضاعة', egp(cogs), ''],
    ['المصاريف', egp(expTotal), `${exps.length} مصروف`],
    ['خسائر الجرد (عجز)', egp(adjShort), `${adjs.filter(a => a.diff < 0).length} تسوية`],
    ['زيادة الجرد', egp(adjSurp), 'تُخصم'],
    ['كاش', egp(cash), ''],
    ['آجل', egp(credit), '']
  ];
  $('#view').innerHTML = `<div class="flex flex-wrap items-center gap-2 mb-4">
    ${rangeBar(S.repRange, 'setRep')}
    <div class="flex items-center gap-2"><input type="date" id="rp-from" class="inp" style="width:9.5rem" value="${S.repFrom || toInputDate(f)}"><span class="muted">إلى</span><input type="date" id="rp-to" class="inp" style="width:9.5rem" value="${S.repTo || toInputDate(addDays(t, -1))}"><button class="btn btn-sec" onclick="applyCustom()">عرض</button></div></div>
    <div class="grid gap-3 md:grid-cols-4 mb-3">
      <div class="totalbox md:col-span-4" style="justify-content:space-between"><span style="flex:none;font-size:1rem">صافي الربح الحقيقي = مبيعات − تكلفة − مصاريف − خسائر جرد</span><strong style="color:${net >= 0 ? 'var(--amber)' : '#ff8a7a'}">${money(net)} <small>ج.م</small></strong></div>
      ${cards.map(([k, v, s]) => `<div class="card stat"><div class="k">${k}</div><div class="v">${v}</div><div class="text-xs muted">${s}</div></div>`).join('')}</div>
    <div class="grid gap-4 lg:grid-cols-2">
      <div><h3 class="font-extrabold mb-2">الزيوت الأكثر مبيعاً</h3>${tbl(['الصنف', 'الكمية', 'الإيراد', 'الربح'], top.map(a => `<tr><td class="font-bold">${esc(a.name)}</td><td>${r2(a.units)}</td><td>${money(a.rev)}</td><td>${money(a.profit)}</td></tr>`).join(''), 'لا توجد مبيعات')}</div>
      <div><h3 class="font-extrabold mb-2">تنبيهات نواقص المخزون</h3>${tbl(['الصنف', 'المتاح', 'حد التنبيه'], lows.map(p => `<tr><td class="font-bold">${esc(p.name)}</td><td><span class="badge ${p.stockUnits <= 0 ? 'b-red' : 'b-amb'}">${p.stockUnits}</span></td><td>${p.lowStock}</td></tr>`).join(''), 'لا توجد نواقص 👍')}</div></div>`;
};

        ${fld('Shop ID (كلمة السر للمشاركة)', `<input id="cl-s" class="inp" value="${esc(c.shopId)}">`)}
        ${fld('المزامنة التلقائية كل (دقائق)', ni('cl-m', c.autoPushMin, 'min="1" max="120"'))}
        <div class="flex gap-2 flex-wrap">
          <button class="btn btn-pri" onclick="saveCloud()">حفظ</button>
          <button class="btn btn-ok" onclick="manualSyncNow()">⬆ مزامنة الآن</button>
          <button class="btn btn-sec" onclick="testCloud()">اختبار الاتصال</button>
        </div>
      </div>
      <div class="mt-4 p-3 rounded text-xs" style="background:#f6f8fb">
        <div><b>آخر رفع:</b> ${c.lastPushAt ? fdt(c.lastPushAt) : 'لم يتم'} ${c.lastPushMsg ? `<span class="badge ${c.lastPushMsg.startsWith('خطأ') ? 'b-red' : 'b-ok'}">${esc(c.lastPushMsg)}</span>` : ''}</div>
        <div class="mt-1"><b>آخر سحب:</b> ${c.lastPullAt ? fdt(c.lastPullAt) : 'لم يتم'} ${c.lastPullMsg ? `<span class="badge">${esc(c.lastPullMsg)}</span>` : ''}</div>
        <div class="mt-1"><b>عمليات مُطبقة محلياً:</b> ${applied} / ${cmdCount}</div>
        <div class="mt-1"><b>الاتصال:</b> ${S.online ? 'متصل ✓' : 'غير متصل'}</div>
      </div>
    </div>
    <div class="card p-5 lg:col-span-2">
      <h3 class="font-extrabold mb-2">📱 بيانات الدخول للمدير</h3>
      <div class="space-y-2 text-sm">
        ${fld('الرابط', `<div class="flex gap-2"><input id="cl-link" class="inp" readonly value="${esc(location.origin + location.pathname)}"><button class="btn btn-sec" onclick="copyEl('cl-link')">نسخ</button></div>`)}
        ${fld('Supabase URL', `<div class="flex gap-2"><input id="cl-sh1" class="inp" readonly value="${esc(c.cloudUrl)}"><button class="btn btn-sec" onclick="copyEl('cl-sh1')">نسخ</button></div>`)}
        ${fld('Anon Key', `<div class="flex gap-2"><input id="cl-sh2" class="inp" readonly value="${esc(c.cloudKey)}"><button class="btn btn-sec" onclick="copyEl('cl-sh2')">نسخ</button></div>`)}
        ${fld('Shop ID', `<div class="flex gap-2"><input id="cl-sh3" class="inp" readonly value="${esc(c.shopId)}"><button class="btn btn-sec" onclick="copyEl('cl-sh3')">نسخ</button></div>`)}
      </div>
      <button class="btn btn-dark w-full mt-3" onclick="window.open(location.origin + location.pathname + '?manager=1', '_blank')">فتح لوحة المدير</button>
    </div>
  </div>`;
  $$('input[name=dm]').forEach(r => r.addEventListener('change', async () => {
    await ss('deployMode', r.value); await loadCfg(); buildChrome();
    toast('تم التغيير — أعد تحميل الصفحة لتطبيق كل المميزات', 'ok');
  }));
};
async function saveCloud() {
  const u = $('#cl-u').value.trim(), k = $('#cl-k').value.trim(), s = $('#cl-s').value.trim();
  if (u && !u.startsWith('http')) return toast('URL غير صحيح', 'err');
  if (!s) return toast('Shop ID مطلوب', 'err');
  await ss('cloudUrl', u); await ss('cloudKey', k); await ss('shopId', s);
  await ss('autoPushMin', Math.max(1, Math.floor(num($('#cl-m').value)) || 5));
  await loadCfg();
  toast('تم الحفظ');
  netChip();
  VIEWS.cloud();
}
async function manualSyncNow() {
  await processIncomingCommands();
  await pushSnapshot(false);
  VIEWS.cloud();
}
async function testCloud() {
  if (!S.cfg.cloudUrl || !S.cfg.cloudKey) return toast('أدخل URL والمفتاح', 'err');
  try {
    const r1 = await fetch(cloudBase() + `/rest/v1/shop_snapshots?shop_id=eq.${encodeURIComponent(S.cfg.shopId)}&select=updated_at&limit=1`, {headers: cloudHeaders()});
    if (r1.status === 404) return toast('جدول shop_snapshots غير موجود', 'err');
    if (!r1.ok) throw new Error('snapshot HTTP ' + r1.status);
    const r2 = await fetch(cloudBase() + `/rest/v1/shop_commands?shop_id=eq.${encodeURIComponent(S.cfg.shopId)}&select=id&limit=1`, {headers: cloudHeaders()});
    if (r2.status === 404) return toast('جدول shop_commands غير موجود — نفّذ SQL', 'err');
    if (!r2.ok) throw new Error('commands HTTP ' + r2.status);
    toast('الاتصال يعمل ✓');
  } catch (e) { toast('فشل: ' + e.message, 'err'); }
}
function copyEl(id) {
  const el = $('#' + id);
  el.select(); el.setSelectionRange(0, 99999);
  try { document.execCommand('copy'); toast('تم النسخ'); } catch (e) { navigator.clipboard && navigator.clipboard.writeText(el.value); }
}

/* ====================================================================
   المستخدمين
   ==================================================================== */
VIEWS.users = async function () {
  const users = await db.users.toArray();
  const rows = users.map(u => `<tr><td class="font-bold">${esc(u.name)}</td><td><span class="badge b-amb">${ROLE_AR[u.role]}</span></td><td>${u.active ? '<span class="badge b-ok">نشط</span>' : '<span class="badge b-red">موقوف</span>'}</td>
    <td>${u.role === 'dev' && S.user.role !== 'dev' ? '' : `<button class="btn btn-sec btn-sm" onclick="userForm(${u.id})">تعديل</button>`}</td></tr>`).join('');
  $('#view').innerHTML = `<div class="space-y-5"><div><div class="flex mb-3"><div class="flex-1"></div><button class="btn btn-pri" onclick="userForm()">+ مستخدم جديد</button></div>${tbl(['الاسم', 'الصلاحية', 'الحالة', ''], rows)}</div>
    <div class="card p-4"><h3 class="font-extrabold mb-1">كلمات مرور العمليات</h3><p class="text-sm muted mb-3">تُطلب من الكاشير عند الخصم أو الحذف. بعد 5 محاولات خاطئة تُقفل العملية 5 دقائق.</p>
      <div class="grid md:grid-cols-2 gap-4">
        <div class="space-y-2">${fld('باسوورد الخصم', `<input id="op-d" type="password" class="inp" autocomplete="off">`)}<button class="btn btn-dark btn-sm" onclick="saveOpPass('discount')">حفظ</button></div>
        <div class="space-y-2">${fld('باسوورد الحذف', `<input id="op-x" type="password" class="inp" autocomplete="off">`)}<button class="btn btn-dark btn-sm" onclick="saveOpPass('delete')">حفظ</button></div></div></div></div>`;
};
async function saveOpPass(kind) {
  const el = $(kind === 'discount' ? '#op-d' : '#op-x'), v = el.value.trim();
  if (v.length < 4) return toast('4 أحرف على الأقل', 'err');
  await ss(kind === 'discount' ? 'discountPassHash' : 'deletePassHash', await hashPw(v));
  await ss('att_' + kind, 0); await ss('lock_' + kind, 0);
  await audit('op_pass', `تغيير باسوورد ${kind === 'discount' ? 'الخصم' : 'الحذف'}`);
  el.value = ''; toast('تم');
}
async function userForm(id) {
  const u = id ? await db.users.get(id) : null;
  const roles = S.user.role === 'dev' ? ['cashier', 'owner', 'dev'] : ['cashier', 'owner'];
  formModal({
    title: u ? 'تعديل مستخدم' : 'مستخدم جديد', size: 'sm',
    body: `<div class="space-y-3">${fld('الاسم', `<input id="us-n" class="inp" value="${esc(u ? u.name : '')}">`)}
      ${fld('الصلاحية', `<select id="us-r" class="inp">${roles.map(r => `<option value="${r}" ${u && u.role === r ? 'selected' : ''}>${ROLE_AR[r]}</option>`).join('')}</select>`)}
      ${fld(u ? 'كلمة مرور جديدة (اختياري)' : 'كلمة المرور', `<input id="us-p" type="password" class="inp" autocomplete="off">`)}
      <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="us-a" ${!u || u.active ? 'checked' : ''}> نشط</label></div>`,
    onSubmit: async m => {
      const name = m.q('#us-n').value.trim(), role = m.q('#us-r').value, pw = m.q('#us-p').value.trim(), active = m.q('#us-a').checked;
      if (!name) { toast('الاسم مطلوب', 'err'); return false; }
      if ((!u || pw) && pw.length < 4) { toast('كلمة المرور 4 أحرف على الأقل', 'err'); return false; }
      if (u && u.id === S.user.id && !active) { toast('لا يمكن إيقاف حسابك', 'err'); return false; }
      const dup = (await db.users.toArray()).find(x => x.name === name && x.id !== id);
      if (dup) { toast('الاسم مستخدم', 'err'); return false; }
      const data = {name, role, active};
      if (pw) data.pin = await hashPw(pw);
      if (u) { await db.users.update(id, data); await audit('edit_user', `تعديل ${name}`); }
      else { data.pin = await hashPw(pw); const nid = await db.users.add(data); await audit('add_user', `إضافة ${name}`); }
      if (u && u.id === S.user.id) { S.user = await db.users.get(id); buildChrome(); }
      toast('تم'); VIEWS.users();
    }
  });
}

/* ====================================================================

  add_product: 'إضافة صنف', edit_product: 'تعديل صنف', hide_product: 'حذف صنف', stock_adjust: 'جرد', revert_stock_adjust: 'عكس جرد', purchase: 'شراء', edit_purchase: 'تعديل شراء', del_purchase: 'حذف شراء', payment: 'دفعة', edit_payment: 'تعديل دفعة', del_payment: 'حذف دفعة', add_party: 'إضافة طرف', edit_party: 'تعديل طرف',
  add_user: 'إضافة مستخدم', edit_user: 'تعديل مستخدم', op_pass: 'تغيير باسوورد', wrong_op_pass: 'باسوورد خاطئ', settings: 'إعدادات', backup: 'نسخ احتياطي',
  remote_expense: 'مصروف (عن بعد)', remote_party: 'طرف (عن بعد)', remote_product: 'صنف (عن بعد)', remote_stock_adjust: 'جرد (عن بعد)', remote_purchase: 'شراء (عن بعد)'};
VIEWS.audit = async function () {
  $('#view').innerHTML = `<div class="mb-3"><input id="au-q" class="inp max-w-xs" placeholder="بحث..." value="${esc(S.auditQ)}"></div><div id="au-list"></div>`;
  const users = Object.fromEntries((await db.users.toArray()).map(u => [u.id, u.name]));
  const logs = await db.auditLog.orderBy('date').reverse().limit(600).toArray();
  const draw = () => {
    const q = S.auditQ.trim().toLowerCase();
    const l = logs.filter(x => !q || (x.details || '').toLowerCase().includes(q) || (ACT_AR[x.action] || x.action).includes(q) || (users[x.userId] || '').toLowerCase().includes(q));
    $('#au-list').innerHTML = tbl(['الوقت', 'المستخدم', 'العملية', 'التفاصيل'], l.map(x => `<tr><td class="whitespace-nowrap">${fdt(x.date)}</td><td>${esc(users[x.userId] || (x.userId === 0 ? 'المدير' : '-'))}</td><td><span class="badge b-amb">${esc(ACT_AR[x.action] || x.action)}</span></td><td>${esc(x.details)}</td></tr>`).join(''), 'السجل فارغ');
  };
  $('#au-q').oninput = e => { S.auditQ = e.target.value; draw(); };
  draw();
};

/* ====================================================================
   النسخ الاحتياطي
   ==================================================================== */
VIEWS.backup = async function () {
  const counts = await Promise.all(db.tables.map(async t => `${t.name}: ${await t.count()}`));
  $('#view').innerHTML = `<div class="grid gap-4 md:grid-cols-2 max-w-4xl">
    <div class="card p-5"><h3 class="font-extrabold mb-1">تصدير نسخة احتياطية</h3><p class="text-sm muted mb-4">تُحفظ كل البيانات في متصفح هذا الجهاز. خذ نسخة دورية.</p><button class="btn btn-pri" onclick="exportBackup()">تحميل النسخة (JSON)</button>
      <p class="text-xs muted mt-4">${counts.join(' • ')}</p></div>
    <div class="card p-5"><h3 class="font-extrabold mb-1">استرجاع نسخة</h3><p class="text-sm muted mb-4">سيتم استبدال كل البيانات الحالية.</p>
      <input type="file" id="bk-file" accept=".json,application/json" class="hidden"><button class="btn btn-dng" onclick="document.getElementById('bk-file').click()">اختيار ملف واسترجاعه</button></div></div>`;
  $('#bk-file').onchange = e => importBackup(e.target.files[0]);
};
async function exportBackup() {
  const data = {};
  for (const t of db.tables) data[t.name] = await t.toArray();
  const blob = new Blob([JSON.stringify({app: 'OilPOS', version: 2, exportedAt: Date.now(), data})], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `oilpos-backup-${toInputDate(Date.now())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  await audit('backup', 'تصدير نسخة احتياطية');
  toast('تم التحميل');
}
async function importBackup(file) {
  if (!file) return;
  let parsed;
  try { parsed = JSON.parse(await file.text()); } catch (e) { return toast('ملف غير صالح', 'err'); }
  if (!parsed || parsed.app !== 'OilPOS' || !parsed.data) return toast('ليس ملف OilPOS', 'err');
  if (!(await confirmBox('سيتم استبدال كل البيانات. متأكد؟', {danger: true, ok: 'استرجاع'}))) return;
  try {
    await db.transaction('rw', db.tables, async () => {
      for (const t of db.tables) { await t.clear(); const rows = parsed.data[t.name]; if (rows && rows.length) await t.bulkPut(rows); }
    });
  } catch (e) { console.error(e); return toast('فشل: ' + e.message, 'err'); }
  toast('تم الاسترجاع — سيتم إعادة التحميل');
  setTimeout(() => location.reload(), 1200);
}

  await loadCfg();

  $('#view').innerHTML = `<div class="card p-5 max-w-3xl"><div class="grid sm:grid-cols-2 gap-4">
    ${fld('اسم المحل', `<input id="st-n" class="inp" value="${esc(c.shopName)}">`)}
    ${fld('عرض الطابعة', `<select id="st-w" class="inp"><option value="80" ${c.paperWidth === '80' ? 'selected' : ''}>80 مم</option><option value="57" ${c.paperWidth === '57' ? 'selected' : ''}>57 مم</option></select>`)}
    ${fld('هاتف المحل', `<input id="st-p" class="inp" value="${esc(c.phone)}">`)}
    ${fld('العنوان', `<input id="st-a" class="inp" value="${esc(c.address)}">`)}
    ${fld('رسالة الفاتورة', `<input id="st-f" class="inp" value="${esc(c.footer)}">`, 'sm:col-span-2')}
    <label class="flex items-center gap-2 text-sm sm:col-span-2"><input type="checkbox" id="st-neg" ${c.allowNegative ? 'checked' : ''}> السماح بالبيع عند نقص المخزون (رصيد بالسالب)</label></div>
    <button class="btn btn-pri btn-lg mt-5" onclick="saveSettings()">حفظ الإعدادات</button></div>`;
};
async function saveSettings() {
  const name = $('#st-n').value.trim();
  if (!name) return toast('اسم المحل مطلوب', 'err');
  await ss('shopName', name); await ss('paperWidth', $('#st-w').value); await ss('phone', $('#st-p').value.trim());
  await ss('address', $('#st-a').value.trim()); await ss('footer', $('#st-f').value.trim());
  await ss('allowNegative', $('#st-neg').checked);
  await audit('settings', 'تحديث الإعدادات');
  await loadCfg(); refreshHeader();
  toast('تم');
}

/* ====================================================================
   Service Worker
   ==================================================================== */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

/* ====================================================================
   تشغيل
   ==================================================================== */
(async function init() {
  try {
    if (typeof Dexie === 'undefined') throw new Error('تعذر تحميل مكتبة Dexie. تأكد من الاتصال بالإنترنت عند أول فتح.');
    await seed();
    const params = new URLSearchParams(location.search);
    if (params.get('manager') === '1') { await enterManagerMode(); return; }
    let uid = null;
    try { uid = sessionStorage.getItem('oilpos_uid'); } catch (e) {}
    if (uid) {
      const u = await db.users.get(+uid);
      if (u && u.active) { S.user = u; await boot(); return; }
    }
    await renderLogin();
  } catch (e) {
    console.error(e);
    document.body.insertAdjacentHTML('afterbegin', `<div style="padding:2rem;text-align:center;font-weight:700;color:#c23b2a">${esc(e.message)}</div>`);
  }
})();

setTimeout(() => { S.online = navigator.onLine; netChip(); }, 500);
</script>
