<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b2230">
<title>OilPOS - نقطة بيع وإدارة مخازن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dexie/3.2.7/dexie.min.js"></script>
<style id="pageStyle"></style>
<style>
:root{--ink:#1b2230;--ink2:#2a3448;--bg:#eef1f5;--line:#dde2ea;--amber:#e8a317;--amberd:#a86f00;--green:#1f8a5b;--red:#c23b2a;--muted:#6b7587;--text:#1c2433}
*{box-sizing:border-box}
html,body{height:100%}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--text);margin:0}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.5rem .95rem;border-radius:.55rem;font-weight:700;font-size:.9rem;border:1px solid transparent;cursor:pointer;transition:background .15s,transform .05s;white-space:nowrap;font-family:inherit}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.inp:focus-visible,.ptile:focus-visible,.nav-item:focus-visible{outline:3px solid #f5c35a;outline-offset:2px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-pri{background:var(--amber);color:#2a1d00}.btn-pri:hover{background:#f2b434}
.btn-dark{background:var(--ink);color:#fff}.btn-dark:hover{background:var(--ink2)}
.btn-sec{background:#fff;border-color:var(--line);color:var(--text)}.btn-sec:hover{background:#f5f7fa}
.btn-dng{background:var(--red);color:#fff}.btn-dng:hover{background:#a82f20}
.btn-ok{background:var(--green);color:#fff}.btn-ok:hover{background:#18704a}
.btn-sm{padding:.28rem .6rem;font-size:.78rem;border-radius:.45rem}
.btn-lg{padding:.8rem 1.2rem;font-size:1.05rem}
.inp{width:100%;padding:.55rem .75rem;border:1px solid var(--line);border-radius:.55rem;background:#fff;font-size:.95rem;font-family:inherit;color:var(--text)}
.inp:focus{outline:2px solid var(--amber);border-color:var(--amber)}
input[type=number]{direction:ltr;text-align:right}
.lbl{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:.25rem}
.card{background:#fff;border:1px solid var(--line);border-radius:.8rem}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{background:#f6f8fb;color:var(--muted);font-weight:700;text-align:right;padding:.6rem .7rem;white-space:nowrap;border-bottom:1px solid var(--line);font-size:.78rem}
.tbl td{padding:.55rem .7rem;border-bottom:1px solid #eef1f5;vertical-align:middle}
.tbl tbody tr:hover{background:#fafbfd}
.badge{display:inline-block;padding:.1rem .55rem;border-radius:999px;font-size:.72rem;font-weight:700;background:#eef1f5;color:var(--muted)}
.b-ok{background:#dcf3e8;color:#12623f}.b-red{background:#fbe1dd;color:#9b2a1c}.b-amb{background:#fdecc4;color:#7a4b00}.b-blue{background:#dbeafe;color:#1e40af}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:.55rem;overflow:hidden;background:#fff}
.seg button{padding:.32rem .75rem;font-size:.8rem;font-weight:700;background:#fff;cursor:pointer;font-family:inherit;border:0;color:var(--text)}
.seg button+button{border-right:1px solid var(--line)}
.seg button.on{background:var(--ink);color:#fff}
.nav-item{display:flex;align-items:center;gap:.7rem;width:100%;padding:.65rem .9rem;border-radius:.6rem;color:#b9c2d3;font-weight:600;font-size:.93rem;cursor:pointer;background:transparent;border:0;font-family:inherit;text-align:right}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.on{background:var(--amber);color:#2a1d00}
.ptile{text-align:right;background:#fff;border:1px solid var(--line);border-radius:.8rem;padding:.7rem .8rem;display:flex;flex-direction:column;gap:.2rem;min-height:6.8rem;cursor:pointer;transition:border-color .12s,box-shadow .12s;font-family:inherit}
.ptile:hover{border-color:var(--amber);box-shadow:0 0 0 3px #e8a31730}
.ptile.out{opacity:.55}
.cl{border:1px solid var(--line);border-radius:.65rem;padding:.6rem .7rem;background:#fcfdfe}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:.5rem;overflow:hidden;background:#fff}
.qty button{width:2rem;height:2rem;font-size:1.1rem;font-weight:800;background:#f3f5f8;border:0;cursor:pointer;font-family:inherit}
.qty input{width:3rem;text-align:center;border:0;height:2rem;font-weight:700;font-family:inherit;direction:ltr}
.link{background:none;border:0;color:var(--amberd);font-weight:700;cursor:pointer;font-family:inherit;font-size:.8rem;padding:0}
.totalbox{background:var(--ink);color:#fff;border-radius:.8rem;padding:.8rem 1rem;display:flex;align-items:baseline;gap:.5rem}
.totalbox span{font-size:.9rem;color:#b9c2d3;font-weight:600;flex:1}
.totalbox strong{font-size:2.1rem;line-height:1;color:var(--amber);font-weight:800;letter-spacing:.5px}
.totalbox small{color:#b9c2d3;font-weight:600}
.stat{padding:1rem 1.1rem}
.stat .k{font-size:.78rem;font-weight:700;color:var(--muted)}
.stat .v{font-size:1.5rem;font-weight:800;margin-top:.15rem}
.empty{text-align:center;color:var(--muted);padding:1.6rem .5rem;font-size:.9rem}
.toast{padding:.7rem 1rem;border-radius:.65rem;color:#fff;font-weight:700;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.2);background:var(--ink);transition:opacity .3s,transform .3s;max-width:22rem}
.toast.ok{background:var(--green)}.toast.err{background:var(--red)}.toast.warn{background:var(--amberd)}
.toast.out{opacity:0;transform:translateY(-8px)}
.modal-ov{background:rgba(20,26,38,.55)}
.modal-body{max-height:calc(100vh - 11rem);overflow-y:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#printArea{display:none;font-family:'Cairo',sans-serif;color:#000;background:#fff;direction:rtl}
.rc{font-size:12px;line-height:1.5}
.rc57{font-size:10px}
.rc h1{font-size:1.35em;text-align:center;font-weight:800;margin:0}
.rc .c{text-align:center}
.rc hr{border:0;border-top:1px dashed #000;margin:4px 0}
.rc .r{display:flex;justify-content:space-between;gap:6px}
.rc .b{font-weight:800}
.rc .big{font-size:1.25em}
#printArea.wide{font-size:12px}
#printArea.wide table{width:100%;border-collapse:collapse}
#printArea.wide th,#printArea.wide td{border:1px solid #444;padding:4px 6px;text-align:right}
.dot{display:inline-block;width:.55rem;height:.55rem;border-radius:999px;margin-left:.25rem}
.dot.on{background:var(--green)}.dot.off{background:var(--red)}.dot.sync{background:var(--amber);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;margin:0;padding:2mm 3mm}
  body{background:#fff}
}
</style>
</head>
<body>

<div id="login" style="display:none" class="min-h-screen flex items-center justify-center p-4"></div>

<div id="app" style="display:none" class="h-screen flex overflow-hidden">
  <div id="scrim" style="display:none" class="fixed inset-0 bg-black/40 z-30" onclick="toggleSide(false)"></div>
  <aside id="side" class="fixed lg:static inset-y-0 right-0 z-40 w-64 shrink-0 translate-x-full lg:translate-x-0 transition-transform flex flex-col" style="background:var(--ink)">
    <div class="flex items-center gap-3 px-5 py-5">
      <svg viewBox="0 0 32 32" class="w-9 h-9"><path d="M16 3c4 6 9 10.5 9 16a9 9 0 0 1-18 0C7 13.5 12 9 16 3z" fill="#e8a317"/><path d="M12 20a4 4 0 0 0 4 4" stroke="#1b2230" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <div><div class="text-white font-extrabold text-xl leading-none">OilPOS</div><div id="sideShop" class="text-xs mt-1 truncate max-w-[10rem]" style="color:#8e99ae"></div></div>
    </div>
    <nav id="nav" class="flex-1 overflow-y-auto px-3 pb-4 space-y-1"></nav>
    <div class="px-4 py-3 text-xs" style="color:#8e99ae;border-top:1px solid rgba(255,255,255,.08)">OilPOS v2.0 • يعمل محلياً 100%</div>
  </aside>
  <div class="flex-1 min-w-0 flex flex-col">
    <header class="flex items-center gap-3 px-3 md:px-5 py-3 bg-white" style="border-bottom:1px solid var(--line)">
      <button class="btn btn-sec btn-sm lg:hidden" onclick="toggleSide(true)" aria-label="القائمة" id="menuBtn"></button>
      <h1 id="pageTitle" class="font-extrabold text-lg md:text-xl truncate"></h1>
      <div class="flex-1"></div>
      <span id="netChip" class="badge hidden sm:inline-block"><span class="dot off"></span>أوفلاين</span>
      <span id="shiftChip" class="badge hidden md:inline-block"></span>
      <div class="text-right leading-tight hidden sm:block"><div id="uName" class="font-bold text-sm"></div><div id="uRole" class="text-xs muted"></div></div>
      <button class="btn btn-sec btn-sm" onclick="logout()" id="logoutBtn"></button>
    </header>
    <main id="view" class="flex-1 overflow-auto p-3 md:p-5"></main>
  </div>
</div>

<div id="modals"></div>
<div id="toasts" class="fixed top-3 left-3 z-[100] flex flex-col gap-2"></div>
<div id="printArea"></div>

<script>
'use strict';
/* =====================================================================
   OilPOS v2.0
   - الجرد الكامل: سجل، عرض، عكس، حساب الخسارة في التقارير
   - مزامنة ثنائية الاتجاه (Command Queue) مع Supabase
   - المدير يقدر يسجّل: مصروفات، مشتريات، أصناف، عملاء، موردين، جرد
   - جهاز المحل يستقبل أوامر المدير ويطبقها عند أول اتصال
   - 3 أوضاع: standalone / cloud-view / cloud-full
   ===================================================================== */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
const num = v => { const n = parseFloat(String(v ?? '').replace(/[٠-٩]/g, d => AR_DIGITS.indexOf(d)).replace('٫', '.')); return isFinite(n) ? n : 0; };
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const r4 = n => Math.round((Number(n) || 0) * 10000) / 10000;
const money = n => r2(n).toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 2});
const egp = n => money(n) + ' ج.م';
const LOC = 'ar-EG-u-nu-latn';
const fdate = t => new Date(t).toLocaleDateString(LOC, {year: 'numeric', month: '2-digit', day: '2-digit'});
const ftime = t => new Date(t).toLocaleTimeString(LOC, {hour: '2-digit', minute: '2-digit'});
const fdt = t => fdate(t) + ' ' + ftime(t);
const sod = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const addDays = (t, n) => { const d = new Date(t); d.setDate(d.getDate() + n); return d.getTime(); };
const toInputDate = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const fromInputDate = s => s ? new Date(s + 'T00:00:00').getTime() : sod(Date.now());
const uid = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const ROLE_AR = {dev: 'مبرمج', owner: 'مالك', cashier: 'كاشير', manager: 'مدير (عن بعد)'};

const ICONS = {
  pos: '<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>',
  shift: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  invoices: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>',
  products: '<path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/>',
  purchases: '<path d="M1 3h15v13H1zM16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>',
  suppliers: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
  customers: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  expenses: '<rect x="1" y="4" width="22" height="16" rx="2"/><path d="M1 10h22"/>',
  stockAdj: '<path d="M3 6h18M3 12h18M3 18h18"/><circle cx="8" cy="6" r="2" fill="#fff"/><circle cx="16" cy="12" r="2" fill="#fff"/><circle cx="10" cy="18" r="2" fill="#fff"/>',
  reports: '<path d="M12 20V10M18 20V4M6 20v-4"/>',
  users: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  audit: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  backup: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  cloud: '<path d="M18 10h-1.3A7 7 0 1 0 4 15.9"/><path d="M18 10a4 4 0 0 1 0 8h-6"/><path d="M9 13l3 3 3-3M12 16V9"/>',
  settings: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  menu: '<path d="M3 12h18M3 6h18M3 18h18"/>'
};
const ic = (n, c = 'w-5 h-5') => `<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;

/* ---------------------------- SHA-256 ---------------------------- */
function sha256Fallback(str) {
  const ascii0 = unescape(encodeURIComponent(str));
  const rr = (v, a) => (v >>> a) | (v << (32 - a));
  const mp = Math.pow, mw = mp(2, 32);
  let ascii = ascii0, result = '';
  const words = [], bitLen = ascii0.length * 8;
  let hash = [], k = [], pc = 0;
  const comp = {};
  for (let cand = 2; pc < 64; cand++) {
    if (!comp[cand]) {
      for (let i = 0; i < 313; i += cand) comp[i] = cand;
      hash[pc] = (mp(cand, .5) * mw) | 0;
      k[pc++] = (mp(cand, 1 / 3) * mw) | 0;
    }
  }
  ascii += '\x80';
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (let i = 0; i < ascii.length; i++) {
    const j = ascii.charCodeAt(i);
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words.length] = ((bitLen / mw) | 0);
  words[words.length] = bitLen;
  for (let j = 0; j < words.length;) {
    const w = words.slice(j, j += 16);
    const old = hash;
    hash = hash.slice(0, 8);
    for (let i = 0; i < 64; i++) {
      const w15 = w[i - 15], w2 = w[i - 2];
      const a = hash[0], e = hash[4];
      const t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] +
        (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
      const t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(t1 + t2) | 0].concat(hash);
      hash[4] = (hash[4] + t1) | 0;
    }
    for (let i = 0; i < 8; i++) hash[i] = (hash[i] + old[i]) | 0;
  }
  for (let i = 0; i < 8; i++) for (let j = 3; j + 1; j--) { const b = (hash[i] >> (j * 8)) & 255; result += ((b < 16) ? 0 : '') + b.toString(16); }
  return result;
}
async function sha256(str) {
  try {
    if (window.crypto && crypto.subtle) {
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) {}
  return sha256Fallback(str);
}
const hashPw = p => sha256('oilpos|' + String(p).trim());

/* ---------------------------- قاعدة البيانات ---------------------------- */
const db = new Dexie('oilpos_db');
db.version(1).stores({
  users: '++id,name,role',
  products: '++id,name,barcode',
  sales: '++id,invNo,date,shiftId,userId,customerId,status',
  purchases: '++id,date,supplierId,status',
  customers: '++id,name,phone',
  suppliers: '++id,name,phone',
  payments: '++id,entityId,entityType,date,shiftId',
  expenses: '++id,cat,date,shiftId',
  shifts: '++id,userId,openedAt,status',
  auditLog: '++id,date,userId,action',
  settings: 'k'
});
db.version(2).stores({
  stockAdjustments: '++id,pid,date,shiftId,userId,type'
});
db.version(3).stores({
  remoteCommands: '++id,commandId,type,status,date'
});
const gs = async (k, d = null) => { const r = await db.settings.get(k); return r ? r.v : d; };
const ss = (k, v) => db.settings.put({k, v});

/* ---------------------------- الحالة العامة ---------------------------- */
const S = {
  user: null, view: 'pos', shift: null, cfg: {}, prods: [], pmap: {}, custs: [],
  cart: [], disc: {type: 'amount', value: 0}, method: 'cash', custId: null, editing: null, editOld: null,
  q: '', paid: '', showHidden: false, pq: '',
  invRange: 'today', invQ: '', expRange: 'month', repRange: 'today', repFrom: '', repTo: '', auditQ: '',
  adjRange: 'month', adjPid: '',
  online: navigator.onLine, syncing: false, managerMode: false,
  cloudSnap: null, cloudAt: null, cloudErr: null, cloudCommands: [], cloudCmdBusy: false,
  pushTimer: null, pullTimer: null
};
const isMgr = () => S.user && S.user.role !== 'cashier';
const isCloud = () => S.cfg.deployMode === 'cloud-view' || S.cfg.deployMode === 'cloud-full';
const isCloudFull = () => S.cfg.deployMode === 'cloud-full';

async function audit(action, details) {
  await db.auditLog.add({date: Date.now(), userId: S.user ? S.user.id : null, action, details: details || ''});
}
async function loadCfg() {
  S.cfg = {
    shopName: await gs('shopName', 'محل زيوت السيارات'),
    paperWidth: await gs('paperWidth', '80'),
    phone: await gs('phone', ''),
    address: await gs('address', ''),
    footer: await gs('footer', 'شكراً لتعاملكم معنا'),
    allowNegative: !!(await gs('allowNegative', false)),
    deployMode: await gs('deployMode', 'standalone'), // standalone | cloud-view | cloud-full
    cloudUrl: await gs('cloudUrl', ''),
    cloudKey: await gs('cloudKey', ''),
    shopId: await gs('shopId', 'oilshop-' + Math.random().toString(36).slice(2, 8)),
    autoPushMin: await gs('autoPushMin', 5),
    lastPushAt: await gs('lastPushAt', 0),
    lastPushMsg: await gs('lastPushMsg', ''),
    lastPullAt: await gs('lastPullAt', 0),
    lastPullMsg: await gs('lastPullMsg', '')
  };
}
async function loadShift() {
  const open = await db.shifts.where('status').equals('open').toArray();
  open.sort((a, b) => a.openedAt - b.openedAt);
  S.shift = open[0] || null;
  S.openCount = open.length;
}
async function loadProducts() {
  S.prods = await db.products.toArray();
  S.pmap = Object.fromEntries(S.prods.map(p => [p.id, p]));
}
async function loadCustomers() {
  S.custs = (await db.customers.toArray()).sort((a, b) => a.name.localeCompare(b.name, 'ar'));
}

async function seed() {
  if ((await db.users.count()) === 0) {
    await db.users.bulkAdd([
      {name: 'المبرمج', role: 'dev', pin: await hashPw('0000'), active: true},
      {name: 'المالك', role: 'owner', pin: await hashPw('1111'), active: true},
      {name: 'الكاشير', role: 'cashier', pin: await hashPw('2222'), active: true}
    ]);
  }
  const ensure = async (k, v) => { if ((await gs(k)) === null) await ss(k, v); };
  await ensure('shopName', 'محل زيوت السيارات');
  await ensure('paperWidth', '80');
  await ensure('discountPassHash', await hashPw('1234'));
  await ensure('deletePassHash', await hashPw('1234'));
  await ensure('invCounter', 0);
  await ensure('allowNegative', false);

/* ---------------------------- إشعارات ونوافذ ---------------------------- */
function toast(msg, type = 'ok') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.setAttribute('role', 'status');
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, 3300);
}
const MODALS = [];
function showModal({title, body, footer = '', size = 'md', dismiss = true, onClose}) {
  const ov = document.createElement('div');
  ov.className = 'modal-ov fixed inset-0 z-[60] flex items-start sm:items-center justify-center p-3 overflow-y-auto';
  const w = {sm: 'max-w-sm', md: 'max-w-lg', lg: 'max-w-3xl', xl: 'max-w-5xl'}[size] || 'max-w-lg';
  ov.innerHTML = `<div class="card w-full ${w} shadow-2xl my-auto" role="dialog" aria-modal="true">
    <div class="flex items-center justify-between px-4 py-3" style="border-bottom:1px solid var(--line)">
      <h3 class="font-extrabold text-lg">${esc(title)}</h3>
      <button class="btn btn-sec btn-sm" data-close aria-label="إغلاق">✕</button>
    </div>
    <div class="p-4 modal-body">${body}</div>
    ${footer ? `<div class="px-4 py-3 flex flex-wrap gap-2 justify-end" style="border-top:1px solid var(--line)">${footer}</div>` : ''}
  </div>`;
  let closed = false;
  const m = {
    el: ov, dismiss,
    q: s => $(s, ov), qa: s => $$(s, ov),
    close(r) {
      if (closed) return;
      closed = true;
      const i = MODALS.indexOf(m); if (i >= 0) MODALS.splice(i, 1);
      ov.remove();
      if (onClose) onClose(r);
    }
  };
  ov.addEventListener('mousedown', e => { if (dismiss && e.target === ov) m.close(); });
  ov.querySelector('[data-close]').onclick = () => m.close();
  $('#modals').appendChild(ov);
  MODALS.push(m);
  const f = ov.querySelector('input:not([type=hidden]),select,textarea');
  if (f) setTimeout(() => f.focus(), 30);
  return m;
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && MODALS.length) { const t = MODALS[MODALS.length - 1]; if (t.dismiss) t.close(); }
});
function confirmBox(msg, {title = 'تأكيد', ok = 'تأكيد', danger = false} = {}) {
  return new Promise(res => {
    let r = false;
    const m = showModal({
      title, size: 'sm',
      body: `<p class="leading-7" style="white-space:pre-line">${esc(msg)}</p>`,
      footer: `<button class="btn btn-sec" data-no>إلغاء</button><button class="btn ${danger ? 'btn-dng' : 'btn-pri'}" data-yes>${esc(ok)}</button>`,
      onClose: () => res(r)
    });
    m.q('[data-no]').onclick = () => m.close();
    m.q('[data-yes]').onclick = () => { r = true; m.close(); };
  });
}
function formModal({title, body, ok = 'حفظ', size = 'md', onSubmit, noEnter = false, extraFooter = ''}) {
  const m = showModal({
    title, body, size,
    footer: `${extraFooter}<button class="btn btn-sec" data-no>إلغاء</button><button class="btn btn-pri" data-ok>${esc(ok)}</button>`
  });
  m.q('[data-no]').onclick = () => m.close();
  const go = async () => {
    const b = m.q('[data-ok]');
    if (b.disabled) return;
    b.disabled = true;
    try {
      const r = await onSubmit(m);
      if (r !== false) m.close();
    } catch (e) { toast(e.message || 'حدث خطأ غير متوقع', 'err'); console.error(e); }
    b.disabled = false;
  };
  m.q('[data-ok]').onclick = go;
  if (!noEnter) m.el.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); go(); } });
  return m;
}
function askText({title, label, ok = 'حفظ', placeholder = ''}) {
  return new Promise(res => {
    let val = null;
    const m = formModal({
      title, ok, size: 'sm',
      body: `<label class="lbl">${esc(label)}</label><textarea id="at-v" class="inp" rows="3" placeholder="${esc(placeholder)}"></textarea>`,
      onSubmit: async mm => {
        const v = mm.q('#at-v').value.trim();
        if (!v) { toast('هذا الحقل مطلوب', 'err'); return false; }
        val = v;
      }
    });
    const old = m.close;
    m.close = function (r) { old.call(m, r); res(val); };
  });
}

/* ---------------------------- كلمات مرور العمليات ---------------------------- */
async function verifyOp(kind, input) {
  const lockKey = 'lock_' + kind, attKey = 'att_' + kind;
  const lockUntil = await gs(lockKey, 0);
  if (lockUntil > Date.now()) {
    const mins = Math.ceil((lockUntil - Date.now()) / 60000);
    return {ok: false, msg: `العملية مقفلة بسبب محاولات خاطئة. حاول بعد ${mins} دقيقة`};
  }
  const stored = await gs(kind === 'discount' ? 'discountPassHash' : 'deletePassHash');
  if ((await hashPw(input)) === stored) { await ss(attKey, 0); return {ok: true}; }
  let att = (await gs(attKey, 0)) + 1;
  await audit('wrong_op_pass', `محاولة خاطئة لباسوورد ${kind === 'discount' ? 'الخصم' : 'الحذف'} (${att})`);
  if (att >= 5) {
    await ss(lockKey, Date.now() + 5 * 60000);
    await ss(attKey, 0);
    return {ok: false, msg: 'تم قفل العملية لمدة 5 دقائق بعد 5 محاولات خاطئة'};
  }
  await ss(attKey, att);
  return {ok: false, msg: `كلمة المرور غير صحيحة (متبقي ${5 - att} محاولات)`};
}

/* ---------------------------- الوردية ---------------------------- */
async function shiftSummary(sh) {
  const sales = (await db.sales.where('shiftId').equals(sh.id).toArray()).filter(s => s.status !== 'deleted');
  const pays = (await db.payments.where('shiftId').equals(sh.id).toArray()).filter(p => p.entityType === 'customer');
  const exps = await db.expenses.where('shiftId').equals(sh.id).toArray();
  const sum = (a, f) => r2(a.reduce((s, x) => s + f(x), 0));
  const cashSales = sum(sales.filter(s => s.method === 'cash'), s => s.total);
  const creditSales = sum(sales.filter(s => s.method === 'credit'), s => s.total);
  const discounts = sum(sales, s => s.discount || 0);
  const paymentsIn = sum(pays, p => p.amount);
  const expOut = sum(exps, e => e.amount);
  const expected = r2((sh.openingCash || 0) + cashSales + paymentsIn - expOut);
  const byUser = {};
  sales.forEach(x => {
    const b = byUser[x.userId] = byUser[x.userId] || {count: 0, cash: 0, credit: 0, total: 0};
    b.count++; b[x.method === 'cash' ? 'cash' : 'credit'] += x.total; b.total = r2(b.total + x.total);
  });
  return {byUser, sales, count: sales.length, cashSales, creditSales, discounts, paymentsIn, expOut, exps, expected, total: r2(cashSales + creditSales)};
}

/* ====================================================================
   المزامنة السحابية (Command Queue)
   ==================================================================== */
function netChip() {
  const el = $('#netChip'); if (!el) return;
  if (S.syncing) el.innerHTML = '<span class="dot sync"></span>مزامنة...';
  else if (!isCloud()) el.innerHTML = '<span class="dot on"></span>محلي';
  else if (S.online) el.innerHTML = '<span class="dot on"></span>متصل' + (S.cfg.lastPushAt ? ' • ' + ftime(S.cfg.lastPushAt) : '');
  else el.innerHTML = '<span class="dot off"></span>أوفلاين (سيُرفع لاحقاً)';
}
const cloudBase = () => (S.cfg.cloudUrl || '').replace(/\/+$/, '');
const cloudHeaders = () => ({
  'apikey': S.cfg.cloudKey,
  'Authorization': 'Bearer ' + S.cfg.cloudKey,
  'Content-Type': 'application/json'
});

async function buildSnapshot() {
  const snap = {exportedAt: Date.now(), version: 2, shopName: S.cfg.shopName};
  for (const t of db.tables) {
    if (t.name === 'settings' || t.name === 'remoteCommands') continue;
    snap[t.name] = await t.toArray();
  }
  return snap;
}

async function pushSnapshot(silent = false) {
  if (!isCloud()) return false;
  if (!S.cfg.cloudUrl || !S.cfg.cloudKey) { if (!silent) toast('لم تُضبط إعدادات السحابة', 'warn'); return false; }
  if (!S.online) { if (!silent) toast('لا يوجد إنترنت — سيتم الرفع تلقائياً', 'warn'); return false; }
  S.syncing = true; netChip();
  try {
    const snap = await buildSnapshot();
    const res = await fetch(cloudBase() + '/rest/v1/shop_snapshots', {
      method: 'POST',
      headers: {...cloudHeaders(), 'Prefer': 'resolution=merge-duplicates,return=minimal'},
      body: JSON.stringify([{shop_id: S.cfg.shopId, data: snap, updated_at: new Date().toISOString()}])
    });
    if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + (await res.text()).slice(0, 200));
    await ss('lastPushAt', Date.now());
    await ss('lastPushMsg', 'نجاح');
    S.cfg.lastPushAt = Date.now(); S.cfg.lastPushMsg = 'نجاح';
    if (!silent) toast('تم رفع البيانات ✓');
    return true;
  } catch (e) {
    console.error(e);
    await ss('lastPushMsg', 'خطأ: ' + e.message);
    S.cfg.lastPushMsg = 'خطأ: ' + e.message;
    if (!silent) toast('فشل الرفع: ' + e.message, 'err');
    return false;
  } finally { S.syncing = false; netChip(); }
}

async function fetchCloudSnapshot() {
  if (!S.cfg.cloudUrl || !S.cfg.cloudKey) throw new Error('لم تُضبط إعدادات السحابة');
  const url = cloudBase() + `/rest/v1/shop_snapshots?shop_id=eq.${encodeURIComponent(S.cfg.shopId)}&select=data,updated_at`;
  const res = await fetch(url, {headers: cloudHeaders()});
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const arr = await res.json();
  if (!arr.length) throw new Error('لا توجد بيانات مرفوعة بعد');
  return arr[0];
}

async function pushCloudCommand(type, payload) {

async function updateCloudCommandStatus(cmdId, status, error = null) {

  });

}

/* -------- تطبيق الأوامر الواردة من المدير -------- */
async function applyRemoteCommand(cmd) {
  const t = cmd.type, p = cmd.payload || {};
  switch (t) {
    case 'add_expense': {
      await db.transaction('rw', db.expenses, db.auditLog, async () => {
        await db.expenses.add({
          cat: p.cat, amount: r2(num(p.amount)), note: p.note || '',
          date: p.date || Date.now(), shiftId: null, userId: 0,
          remote: true, remoteCmdId: cmd.id
        });
        await db.auditLog.add({date: Date.now(), userId: 0, action: 'remote_expense',
          details: `[عن بعد] مصروف ${p.cat} بقيمة ${money(p.amount)}${p.note ? ' - ' + p.note : ''}`});
      });
      break;
    }
    case 'add_customer':
    case 'add_supplier': {
      const table = t === 'add_customer' ? db.customers : db.suppliers;
      await db.transaction('rw', table, db.auditLog, async () => {
        const existing = await table.where('name').equals(p.name).first();
        if (existing) throw new Error('موجود بالفعل: ' + p.name);
        await table.add({name: p.name, phone: p.phone || '', balance: r2(num(p.balance) || 0), remote: true, remoteCmdId: cmd.id});
        await db.auditLog.add({date: Date.now(), userId: 0, action: 'remote_party',
          details: `[عن بعد] إضافة ${t === 'add_customer' ? 'عميل' : 'مورد'} ${p.name}`});
      });
      break;
    }
    case 'edit_customer':
    case 'edit_supplier': {
      const table = t === 'edit_customer' ? db.customers : db.suppliers;
      await db.transaction('rw', table, db.auditLog, async () => {
        const ex = await table.where('name').equals(p.oldName).first();
        if (!ex) throw new Error('غير موجود: ' + p.oldName);
        await table.update(ex.id, {name: p.name, phone: p.phone || ''});
        await db.auditLog.add({date: Date.now(), userId: 0, action: 'remote_party',
          details: `[عن بعد] تعديل ${t === 'edit_customer' ? 'عميل' : 'مورد'} من ${p.oldName} إلى ${p.name}`});
      });
      break;
    }
    case 'edit_product': {
      await db.transaction('rw', db.products, db.auditLog, async () => {
        const ex = await db.products.where('name').equals(p.oldName).first();
        if (!ex) throw new Error('الصنف غير موجود: ' + p.oldName);
        const patch = {};
        ['name','barcode','size','unitsPerCarton','retailPrice','wholesalePrice','lowStock'].forEach(k => {
          if (p[k] !== undefined && p[k] !== '') patch[k] = (typeof p[k] === 'number') ? num(p[k]) : p[k];
        });
        await db.products.update(ex.id, patch);
        await db.auditLog.add({date: Date.now(), userId: 0, action: 'remote_product',
          details: `[عن بعد] تعديل الصنف ${p.oldName}`});
      });
      break;
    }
    case 'add_product': {
      await db.transaction('rw', db.products, db.auditLog, async () => {
        const dup = await db.products.where('name').equals(p.name).first();
        if (dup) throw new Error('الصنف موجود: ' + p.name);
        const data = {
          name: p.name, barcode: p.barcode || '', size: p.size || '',
          unitsPerCarton: Math.max(1, Math.floor(num(p.unitsPerCarton) || 1)),
          retailPrice: num(p.retailPrice), wholesalePrice: num(p.wholesalePrice),
          lastCost: num(p.lastCost), avgCost: num(p.lastCost),
          stockUnits: num(p.openingStock) || 0, lowStock: num(p.lowStock) || 5,
          active: true, remote: true, remoteCmdId: cmd.id
        };
        await db.products.add(data);
        await db.auditLog.add({date: Date.now(), userId: 0, action: 'remote_product',
          details: `[عن بعد] إضافة صنف ${p.name} برصيد ${data.stockUnits}`});
      });
      break;
    }
    case 'stock_adjust': {
      await db.transaction('rw', db.products, db.stockAdjustments, db.auditLog, async () => {
        const ex = await db.products.where('name').equals(p.name).first();
        if (!ex) throw new Error('الصنف غير موجود: ' + p.name);
        if (Math.abs(ex.stockUnits - num(p.before)) > 0.001) {
          throw new Error(`تعارض: الرصيد الحالي ${ex.stockUnits} ليس ${p.before} (تغيّر بعد الجرد)`);
        }
        const diff = r2(num(p.after) - num(p.before));
        const costValue = r2(Math.abs(diff) * (ex.avgCost || 0));
        await db.products.update(ex.id, {stockUnits: num(p.after)});
        await db.stockAdjustments.add({
          pid: ex.id, name: ex.name, before: num(p.before), after: num(p.after), diff,
          unitCost: ex.avgCost || 0, costValue, type: p.type || 'shortage',
          reason: p.reason || 'عن بعد', note: (p.note || '') + ' [من المدير عن بعد]',
          date: p.date || Date.now(), userId: 0, shiftId: null, remote: true
        });
        await db.auditLog.add({date: Date.now(), userId: 0, action: 'remote_stock_adjust',
          details: `[عن بعد] جرد ${ex.name}: ${p.before} → ${p.after}`});
      });
      break;
    }
    case 'add_purchase': {
      if (!p.items || !p.items.length) throw new Error('لا توجد بنود');
      await db.transaction('rw', db.products, db.purchases, db.suppliers, db.auditLog, async () => {
        const sup = await db.suppliers.where('name').equals(p.supplierName).first();
        const supId = sup ? sup.id : await db.suppliers.add({name: p.supplierName, phone: '', balance: 0});
        const items = [];
        for (const it of p.items) {
          const prod = await db.products.where('name').equals(it.productName).first();
          if (!prod) throw new Error('الصنف غير موجود: ' + it.productName);
          const upc = prod.unitsPerCarton || 1;
          const units = num(it.cartons) * upc + num(it.loose);
          if (units <= 0) throw new Error('كمية غير صحيحة: ' + it.productName);
          const unitCost = num(it.cartonCost) / upc;
          const total = r2(units * unitCost);
          items.push({pid: prod.id, name: prod.name, size: prod.size || '', upc,
            cartons: num(it.cartons), loose: num(it.loose), cartonCost: num(it.cartonCost),
            units, unitCost, total});
          const base = Math.max(prod.stockUnits || 0, 0);
          const avg = (base * (prod.avgCost || 0) + units * unitCost) / (base + units);
          await db.products.update(prod.id, {
            stockUnits: r4((prod.stockUnits || 0) + units),
            lastCost: r4(unitCost), avgCost: r4(avg)
          });
        }
        const total = r2(items.reduce((s, i) => s + i.total, 0));
        const paid = r2(num(p.paid) || 0);
        const due = r2(total - paid);
        const rec = {
          date: p.date || Date.now(), supplierId: supId, items, total, paid, due,
          method: due === 0 ? 'cash' : paid === 0 ? 'credit' : 'partial',
          status: 'active', userId: 0, remote: true, remoteCmdId: cmd.id
        };
        const id = await db.purchases.add(rec);
        if (due > 0) {
          const sp = await db.suppliers.get(supId);
          await db.suppliers.update(supId, {balance: r2((sp.balance || 0) + due)});
        }
        await db.auditLog.add({date: Date.now(), userId: 0, action: 'remote_purchase',
          details: `[عن بعد] فاتورة شراء #${id} من ${p.supplierName} بقيمة ${money(total)}`});
      });
      break;
    }
    default:
      throw new Error('نوع أمر غير معروف: ' + t);
  }
  // سجّل الأمر محلياً كمنفذ
  await db.remoteCommands.add({
    commandId: cmd.id, type: t, status: 'applied',
    date: Date.now(), payload: JSON.stringify(p).slice(0, 500)
  });
}

async function processIncomingCommands() {
  if (!isCloud()) return 0;
  if (!S.online) return 0;
  if (!S.cfg.cloudUrl || !S.cfg.cloudKey) return 0;
  let applied = 0, failed = 0;
  try {
    const cmds = await fetchCloudCommands(true);
    for (const cmd of cmds) {
      try {
        await applyRemoteCommand(cmd);
        await updateCloudCommandStatus(cmd.id, 'applied');
        applied++;
      } catch (e) {
        await updateCloudCommandStatus(cmd.id, 'failed', e.message);
        failed++;
        console.warn('فشل تطبيق أمر:', cmd, e);
      }
    }
    await ss('lastPullAt', Date.now());
    await ss('lastPullMsg', `استُقبل ${applied} - فشل ${failed}`);
    S.cfg.lastPullAt = Date.now(); S.cfg.lastPullMsg = `استُقبل ${applied} - فشل ${failed}`;
    if (applied > 0) {
      toast(`📥 استقبلت ${applied} عملية من المدير${failed ? ' - فشل ' + failed : ''}`, failed ? 'warn' : 'ok');
      if (S.view === 'stockAdj' || S.view === 'reports' || S.view === 'products' || S.view === 'expenses' || S.view === 'purchases') VIEWS[S.view]();
    }
  } catch (e) {
    console.warn('فشل جلب الأوامر:', e);
  }
  return applied;
}

function schedulePush(delayMs = 8000) {
  if (!isCloud()) return;
  clearTimeout(S.pushTimer);
  S.pushTimer = setTimeout(() => pushSnapshot(true), delayMs);
}
function schedulePull(delayMs = 4000) {
  if (!isCloud()) return;
  clearTimeout(S.pullTimer);
  S.pullTimer = setTimeout(async () => { await processIncomingCommands(); }, delayMs);
}
function startAutoSync() {
  setInterval(async () => {
    if (!isCloud() || !S.online) return;
    await processIncomingCommands();
    await pushSnapshot(true);
  }, Math.max(1, S.cfg.autoPushMin) * 60000);
}

    S.cloudAt = row.updated_at;
    S.cloudCommands = cmds;
    S.cloudErr = null;
    draw();

  } catch (e) {
    S.cloudErr = e.message;
    draw();
  }
};

function mgrPurchase() {
  const prods = (S.cloudSnap && S.cloudSnap.products) || [];
  const sups = (S.cloudSnap && S.cloudSnap.suppliers) || [];
  if (!prods.length) return toast('انتظر تحميل بيانات المحل أولاً', 'warn');
  const D = {items: [{productName: '', cartons: '', loose: '', cartonCost: ''}]};
  const m = formModal({
    title: 'فاتورة شراء جديدة', size: 'xl', ok: 'إرسال للمحل', noEnter: true,
    body: `<div class="grid sm:grid-cols-2 gap-3 mb-3">
        ${fld('المورد', `<input id="mpu-sup" class="inp" list="sup-list" placeholder="اكتب اسم المورد"><datalist id="sup-list">${sups.map(s => `<option value="${esc(s.name)}">`).join('')}</datalist>`)}

      <div id="mpu-rows" class="space-y-2"></div>
      <button class="btn btn-sec btn-sm mt-2" id="mpu-add">+ إضافة صنف</button>
      <div class="grid sm:grid-cols-3 gap-3 mt-4 items-end">
        <div><div class="lbl">الإجمالي</div><div id="mpu-total" class="text-xl font-extrabold">0 ج.م</div></div>
        ${fld('المدفوع', ni('mpu-paid', 0))}
        <div><div class="lbl">المتبقي</div><div id="mpu-due" class="text-xl font-extrabold" style="color:var(--red)">0 ج.م</div></div></div>`,
    onSubmit: async mm => {
      const supplierName = mm.q('#mpu-sup').value.trim();
      if (!supplierName) { toast('اكتب اسم المورد', 'err'); return false; }
      const items = [];
      for (const it of D.items) {
        if (!it.productName && !num(it.cartons) && !num(it.loose)) continue;
        if (!it.productName) { toast('اختر الصنف', 'err'); return false; }
        const prod = prods.find(p => p.name === it.productName);
        const upc = prod ? prod.unitsPerCarton || 1 : 1;
        const units = num(it.cartons) * upc + num(it.loose);
        if (units <= 0) { toast('كمية غير صحيحة', 'err'); return false; }
        if (num(it.cartonCost) <= 0) { toast('أدخل تكلفة الكرتونة', 'err'); return false; }
        items.push({productName: it.productName, cartons: num(it.cartons), loose: num(it.loose), cartonCost: num(it.cartonCost)});
      }
      if (!items.length) { toast('أضف صنفاً واحداً', 'err'); return false; }
      const total = r2(items.reduce((s, i) => {
        const p = prods.find(x => x.name === i.productName);
        const upc = p ? p.unitsPerCarton || 1 : 1;
        return s + (num(i.cartons) * upc + num(i.loose)) * (num(i.cartonCost) / upc);
      }, 0));
      const paid = num(mm.q('#mpu-paid').value);
      if (paid > total + 0.001) { toast('المدفوع أكبر من الإجمالي', 'err'); return false; }
      try {
        await pushCloudCommand('add_purchase', {
          supplierName, items, paid: r2(paid),
          date: fromInputDate(mm.q('#mpu-date').value)
        });
        toast('تم الإرسال'); VIEWS.managerDash();
      } catch (e) { toast('فشل: ' + e.message, 'err'); return false; }
    }
  });
  const rowsEl = m.q('#mpu-rows');
  const calcLine = it => {
    const p = prods.find(x => x.name === it.productName);
    const upc = p ? p.unitsPerCarton || 1 : 1;
    const units = num(it.cartons) * upc + num(it.loose);
    return {units, total: r2(units * num(it.cartonCost) / upc)};
  };
  const totals = () => {
    const t = r2(D.items.reduce((s, it) => s + calcLine(it).total, 0));
    m.q('#mpu-total').textContent = egp(t);
    m.q('#mpu-due').textContent = egp(Math.max(t - num(m.q('#mpu-paid').value), 0));
  };
  const draw = () => {
    rowsEl.innerHTML = D.items.map((it, i) => `<div class="grid grid-cols-2 md:grid-cols-[2.2fr_1fr_1fr_1.2fr_auto] gap-2 items-end p-2 rounded-lg" style="border:1px solid var(--line)" data-i="${i}">
      <div class="col-span-2 md:col-span-1"><label class="lbl">الصنف</label><select data-f="productName" class="inp"><option value="">اختر...</option>${prods.filter(p => p.active).map(p => `<option value="${esc(p.name)}" ${it.productName === p.name ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>
      <div><label class="lbl">كراتين</label><input data-f="cartons" type="number" min="0" step="any" class="inp" value="${esc(it.cartons)}"></div>
      <div><label class="lbl">فرط</label><input data-f="loose" type="number" min="0" step="any" class="inp" value="${esc(it.loose)}"></div>
      <div><label class="lbl">تكلفة الكرتونة</label><input data-f="cartonCost" type="number" min="0" step="any" class="inp" value="${esc(it.cartonCost)}"></div>
      <button class="btn btn-sec btn-sm" data-rm="${i}">✕</button></div>`).join('');
    totals();
  };
  rowsEl.addEventListener('input', e => {
    const row = e.target.closest('[data-i]'), f = e.target.dataset.f;
    if (!row || !f) return;
    const i = +row.dataset.i;
    D.items[i][f] = e.target.value;
    totals();
  });
  rowsEl.addEventListener('click', e => {
    const b = e.target.closest('[data-rm]'); if (!b) return;
    if (D.items.length > 1) D.items.splice(+b.dataset.rm, 1); else D.items = [{productName: '', cartons: '', loose: '', cartonCost: ''}];
    draw();
  });
  m.q('#mpu-add').onclick = () => { D.items.push({productName: '', cartons: '', loose: '', cartonCost: ''}); draw(); };
  m.q('#mpu-paid').oninput = totals;
  draw();
}

/* ====================================================================
   نقطة البيع
   ==================================================================== */
const unitsOf = l => l.qty * (l.mode === 'carton' ? l.upc : 1);
const defPrice = (p, m) => m === 'carton' ? (p.wholesalePrice > 0 ? p.wholesalePrice : p.retailPrice) : p.retailPrice;
function resetCart() {
  S.cart = []; S.disc = {type: 'amount', value: 0}; S.method = 'cash'; S.custId = null;
  S.editing = null; S.editOld = null; S.paid = '';
}
function availFor(pid) {
  const p = S.pmap[pid];
  let a = p ? p.stockUnits : 0;
  if (S.editOld) S.editOld.items.forEach(i => { if (i.pid === pid) a += i.units; });
  return a;
}
const usedFor = pid => S.cart.filter(l => l.pid === pid).reduce((s, l) => s + unitsOf(l), 0);
function stockGuard(pid) {
  if (S.cfg.allowNegative) return true;
  const a = availFor(pid), u = usedFor(pid);
  if (u > a + 1e-9) { toast(`المتاح من هذا الصنف ${a} فقط`, 'err'); return false; }
  return true;
}
function calcCart() {
  let sub = 0, cost = 0;
  S.cart.forEach(l => { const u = unitsOf(l); sub += r2(u * l.unitPrice); cost += u * (l.lastCost || 0); });
  sub = r2(sub); cost = r2(cost);
  let d = S.disc.type === 'percent' ? sub * num(S.disc.value) / 100 : num(S.disc.value);
  d = r2(Math.min(Math.max(d, 0), sub));
  return {sub, cost, disc: d, total: r2(sub - d)};
}

  const q = $('#pos-q');

  q.onkeydown = e => {

    if (!t) return;

    if (hit) { addToCart(hit.id); S.q = ''; q.value = ''; renderGrid(); }
    else toast('لا يوجد صنف مطابق', 'err');

function renderGrid() {
  const g = $('#grid'); if (!g) return;
  const q = S.q.trim().toLowerCase();
  const list = S.prods.filter(p => p.active && (!q || p.name.toLowerCase().includes(q) || (p.barcode || '').toLowerCase().includes(q) || (p.size || '').toLowerCase().includes(q)));
  g.innerHTML = list.length ? list.map(p => {
    const out = p.stockUnits <= 0, low = !out && p.stockUnits <= p.lowStock;
    return `<button class="ptile ${out ? 'out' : ''}" onclick="addToCart(${p.id})">
      <span class="font-bold text-sm leading-snug">${esc(p.name)}</span>
      <span class="text-xs muted">${esc(p.size || '')}</span>
      <span class="mt-auto flex items-end justify-between w-full pt-1">
        <span class="font-extrabold text-lg" style="color:var(--amberd)">${money(p.retailPrice)}</span>
        <span class="badge ${out ? 'b-red' : low ? 'b-amb' : 'b-ok'}">${out ? 'نفذ' : 'متاح ' + p.stockUnits}</span>
      </span></button>`;
  }).join('') : `<div class="col-span-full empty">لا توجد أصناف مطابقة</div>`;
}
function addToCart(pid) {
  const p = S.pmap[pid];
  if (!p || !p.active) return;
  let l = S.cart.find(x => x.pid === pid && x.mode === 'unit');
  if (l) { l.qty += 1; if (!stockGuard(pid)) { l.qty -= 1; return; } }
  else {
    l = {pid, name: p.name, size: p.size || '', upc: p.unitsPerCarton || 1, mode: 'unit', qty: 1, unitPrice: defPrice(p, 'unit'), cost: p.avgCost || p.lastCost || 0, lastCost: p.lastCost || 0};
    S.cart.push(l);
    if (!stockGuard(pid)) { S.cart.pop(); return; }
  }
  renderCart();
}
function setMode(i, m) {

  if (!l || l.mode === m) return;
  if (m === 'carton' && l.upc <= 1) return toast('هذا الصنف ليس له عبوة كرتونة', 'err');
  const old = {mode: l.mode, unitPrice: l.unitPrice};
  l.mode = m;
  l.unitPrice = defPrice(S.pmap[l.pid], m);

function setQty(i, v) {
  const l = S.cart[i]; if (!l) return;
  let q = Math.floor(num(v)); if (q < 1) q = 1;
  const o = l.qty; l.qty = q;
  if (!stockGuard(l.pid)) l.qty = o;
  renderCart();
}

function openDiscount() {
  if (!S.cart.length) return toast('السلة فارغة', 'err');
  const c = calcCart();
  const maxD = r2(Math.max(0, c.sub - c.cost));
  const needPw = S.user.role === 'cashier';
  formModal({
    title: 'خصم على الفاتورة', ok: 'تطبيق الخصم', size: 'sm',
    body: `<div class="space-y-3">
      ${fld('نوع الخصم', `<select id="d-type" class="inp"><option value="percent">نسبة مئوية %</option><option value="amount">مبلغ ثابت</option></select>`)}
      ${fld('قيمة الخصم', ni('d-val', '', 'step="any"'))}
      ${needPw ? fld('باسوورد الخصم', `<input id="d-pw" type="password" class="inp" autocomplete="off">`) : ''}
      <p class="text-xs muted">${needPw ? 'لا يمكن أن يقل إجمالي الفاتورة عن التكلفة.' : `أقصى خصم ممكن بدون الوصول للتكلفة: ${egp(maxD)}`}</p></div>`,

      const amt = r2(type === 'percent' ? c.sub * val / 100 : val);
      if (amt > c.sub) { toast('الخصم أكبر من قيمة الفاتورة', 'err'); return false; }
      if (amt > maxD + 0.001) { toast('الخصم يجعل إجمالي الفاتورة أقل من التكلفة', 'err'); return false; }

      renderCart();

}

async function applySale(sale, sign) {
  for (const it of sale.items) {
    const p = await db.products.get(it.pid);
    if (p) await db.products.update(it.pid, {stockUnits: r4((p.stockUnits || 0) - sign * it.units)});
  }
  if (sale.method === 'credit' && sale.customerId) {
    const c = await db.customers.get(sale.customerId);
    if (c) await db.customers.update(c.id, {balance: r2((c.balance || 0) + sign * sale.total)});
  }
}
async function checkStock(items) {
  if (S.cfg.allowNegative) return;
  const need = {};
  items.forEach(i => { need[i.pid] = (need[i.pid] || 0) + i.units; });
  for (const pid in need) {
    const p = await db.products.get(+pid);
    if (!p) throw new Error('صنف غير موجود');
    if ((p.stockUnits || 0) < need[pid] - 1e-9) throw new Error(`المخزون غير كافٍ: ${p.name} (المتاح ${p.stockUnits})`);
  }
}
async function shiftLocked(shiftId) {
  const sh = await db.shifts.get(shiftId);
  return !!sh && sh.status === 'closed';
}
async function checkout() {
  if (!S.cart.length) return toast('السلة فارغة', 'err');
  const c = calcCart();
  if (S.method === 'credit' && !S.custId) return toast('اختر العميل للبيع الآجل', 'err');
  if (S.disc && c.disc > 0 && c.total < c.cost - 0.001) return toast('الخصم يجعل إجمالي الفاتورة أقل من التكلفة', 'err');
  if (S.user.role === 'cashier') {
    const bad = S.cart.find(l => l.unitPrice < (l.lastCost || 0));
    if (bad) return toast(`سعر ${bad.name} أقل من التكلفة`, 'err');
  }
  let reason = null;
  if (S.editing) {
    reason = await askText({title: 'سبب تعديل الفاتورة', label: 'اكتب سبب التعديل (إجباري)', ok: 'حفظ التعديل'});
    if (!reason) return;
  }
  const items = S.cart.map(l => ({
    pid: l.pid, name: l.name, size: l.size, mode: l.mode, qty: l.qty, upc: l.upc, units: unitsOf(l),
    unitPrice: l.unitPrice, cost: l.cost, lastCost: l.lastCost, total: r2(unitsOf(l) * l.unitPrice)
  }));
  const fields = {
    items, subTotal: c.sub, discount: c.disc, discountType: S.disc.type, discountValue: num(S.disc.value),
    total: c.total, method: S.method, customerId: S.method === 'credit' ? S.custId : null
  };
  let saved = null;
  try {
    await db.transaction('rw', db.sales, db.products, db.customers, db.settings, db.auditLog, db.shifts, async () => {
      if (S.editing) {
        const old = await db.sales.get(S.editing);
        if (!old || old.status === 'deleted') throw new Error('الفاتورة غير متاحة للتعديل');
        if (await shiftLocked(old.shiftId)) throw new Error('هذه الفاتورة تخص وردية مقفلة ولا يمكن تعديلها');
        await applySale(old, -1);
        await checkStock(items);
        await applySale(fields, 1);
        const upd = {...fields, editReason: reason, editedAt: Date.now()};
        await db.sales.update(old.id, upd);
        saved = {...old, ...upd};
        await db.auditLog.add({date: Date.now(), userId: S.user.id, action: 'edit_sale', details: `تعديل ${old.invNo} - السبب: ${reason} - الإجمالي من ${money(old.total)} إلى ${money(c.total)}`});
      } else {
        const cur = await db.shifts.get(S.shift.id);
        if (!cur || cur.status !== 'open') throw new Error('الوردية أُغلقت. افتح وردية جديدة');
        await checkStock(items);
        await applySale(fields, 1);
        const n = (await gs('invCounter', 0)) + 1;
        await ss('invCounter', n);
        const sale = {...fields, invNo: 'INV-' + String(n).padStart(6, '0'), date: Date.now(), shiftId: S.shift.id, userId: S.user.id, status: 'active', editReason: ''};
        sale.id = await db.sales.add(sale);
        saved = sale;
        await db.auditLog.add({date: Date.now(), userId: S.user.id, action: 'sale', details: `فاتورة ${sale.invNo} بقيمة ${money(sale.total)} (${sale.method === 'cash' ? 'كاش' : 'آجل'})`});
      }
    });
  } catch (e) { console.error(e); return toast(e.message || 'تعذر حفظ الفاتورة', 'err'); }
  const wasEdit = !!S.editing;
  resetCart();
  await loadProducts(); await loadCustomers();
  renderGrid(); renderCart();
  saleDone(saved, wasEdit);
  schedulePush(3000);
}
function saleDone(sale, wasEdit) {
  const m = showModal({
    title: wasEdit ? 'تم حفظ التعديل' : 'تمت العملية بنجاح', size: 'sm',
    body: `<div class="text-center py-2"><div class="muted text-sm">رقم الفاتورة</div><div class="font-extrabold text-lg">${esc(sale.invNo)}</div>
      <div class="totalbox mt-3 justify-center"><strong>${money(sale.total)}</strong><small>ج.م</small></div>
      <div class="mt-2 text-sm muted">${sale.method === 'cash' ? 'دفع نقدي' : 'بيع آجل'}</div></div>`,
    footer: `<button class="btn btn-sec" data-print>طباعة الفاتورة</button><button class="btn btn-pri" data-new>فاتورة جديدة</button>`
  });
  m.q('[data-print]').onclick = () => printSale(sale.id);
  m.q('[data-new]').onclick = () => { m.close(); const q = $('#pos-q'); if (q) q.focus(); };
  m.q('[data-new]').focus();
}

async function openShift() {

  if ($('#sh-open').value.trim() === '' || v < 0) return toast('أدخل رصيد الدرج الافتتاحي', 'err');

  if (S.shift) { const o = await db.users.get(S.shift.userId); return toast(`توجد وردية مفتوحة (فتحها ${o ? o.name : ''})`, 'err'); }
  const id = await db.shifts.add({userId: S.user.id, openedAt: Date.now(), closedAt: null, closedBy: null, openingCash: r2(v), countedCash: null, expectedCash: null, diff: null, status: 'open'});
  await audit('open_shift', `فتح وردية #${id} برصيد افتتاحي ${money(v)}`);

function rangeFor(k) {
  const t0 = sod(Date.now());
  if (k === 'today') return [t0, addDays(t0, 1)];
  if (k === 'yesterday') return [addDays(t0, -1), t0];
  if (k === 'week') return [addDays(t0, -6), addDays(t0, 1)];
  if (k === 'month') { const d = new Date(t0); d.setDate(1); return [d.getTime(), addDays(t0, 1)]; }
  return [t0, addDays(t0, 1)];
}
const RANGES = [['today', 'اليوم'], ['yesterday', 'أمس'], ['week', '7 أيام'], ['month', 'الشهر']];
const rangeBar = (cur, fn, extra = '') => `<div class="seg">${RANGES.map(([k, l]) => `<button class="${cur === k ? 'on' : ''}" onclick="${fn}('${k}')">${l}</button>`).join('')}${extra}</div>`;

function adjustStock(id) {
  const p = S.pmap[id], upc = p.unitsPerCarton || 1;
  formModal({
    title: `جرد وتسوية: ${p.name}`, size: 'md', ok: 'اعتماد التسوية',
    body: `<div class="space-y-3">
      <div class="p-3 rounded-lg text-sm" style="background:#f6f8fb">
        الرصيد الحالي: <b>${p.stockUnits}</b> جركن • متوسط التكلفة: <b>${money(p.avgCost || 0)}</b> ج.م/جركن
      </div>
      <div class="grid grid-cols-2 gap-3">
        ${upc > 1 ? fld('كراتين (فعلي)', ni('ad-c', '', 'min="0" placeholder="0"')) : ''}
        ${fld(upc > 1 ? 'جراكن فرط' : 'الكمية الفعلية', ni('ad-u', '', 'min="0" placeholder="0"'))}
      </div>
      ${fld('النوع', `<select id="ad-t" class="inp"><option value="shortage">عجز</option><option value="surplus">زيادة</option><option value="correction">تصحيح</option></select>`)}
      ${fld('السبب', `<select id="ad-r" class="inp"><option>تلف/تكسير</option><option>سرقة/فقد</option><option>خطأ إدخال سابق</option><option>مرتجع غير مسجل</option><option>جرد دوري</option><option>تجربة/خطأ</option><option>أخرى</option></select>`)}
      ${fld('ملاحظة', `<input id="ad-n" class="inp">`)}
      <p id="ad-preview" class="text-sm font-bold" style="color:var(--amberd)"></p>
    </div>`,
    onSubmit: async m => {
      const cIn = m.q('#ad-c'), c = cIn ? Math.floor(num(cIn.value)) : 0;
      const total = c * upc + num(m.q('#ad-u').value);
      if (total < 0) { toast('كمية غير صحيحة', 'err'); return false; }
      const before = p.stockUnits;
      const diff = r2(total - before);
      if (diff === 0) { toast('الرصيد مطابق بالفعل', 'warn'); return false; }
      const type = m.q('#ad-t').value;
      const costValue = r2(Math.abs(diff) * (p.avgCost || 0));
      await db.transaction('rw', db.products, db.stockAdjustments, db.auditLog, async () => {
        await db.products.update(id, {stockUnits: total});
        await db.stockAdjustments.add({
          pid: id, name: p.name, before, after: total, diff,
          unitCost: p.avgCost || 0, costValue, type,
          reason: m.q('#ad-r').value, note: m.q('#ad-n').value.trim(),
          date: Date.now(), userId: S.user.id,
          shiftId: S.shift ? S.shift.id : null
        });
        await db.auditLog.add({
          date: Date.now(), userId: S.user.id, action: 'stock_adjust',
          details: `جرد ${p.name}: ${before} → ${total} (${diff > 0 ? '+' : ''}${diff}) قيمة ${money(costValue)} - ${m.q('#ad-r').value} ${m.q('#ad-n').value.trim()}`
        });
      });
      toast(`تمت التسوية — ${diff > 0 ? 'زيادة' : 'عجز'} بقيمة ${egp(costValue)}`);
      schedulePush();
      VIEWS.products();
    }
  });
  const upd = () => {
    const fm = MODALS[MODALS.length - 1]; if (!fm) return;
    const c = Math.floor(num(fm.q('#ad-c') ? fm.q('#ad-c').value : 0));
    const total = c * upc + num(fm.q('#ad-u').value);
    const diff = r2(total - p.stockUnits);
    const val = r2(Math.abs(diff) * (p.avgCost || 0));
    fm.q('#ad-preview').textContent = diff === 0 ? 'لا يوجد فرق' : `${diff > 0 ? 'زيادة' : 'عجز'} بمقدار ${Math.abs(diff)} جركن = ${egp(val)}`;
  };
  setTimeout(() => {
    const fm = MODALS[MODALS.length - 1]; if (!fm) return;
    ['#ad-c', '#ad-u'].forEach(s => { const el = fm.q(s); if (el) el.addEventListener('input', upd); });
  }, 50);
}

VIEWS.stockAdj = async function () {
  const [f, t] = rangeFor(S.adjRange);
  const um = Object.fromEntries((await db.users.toArray()).map(u => [u.id, u.name]));
  let list = await db.stockAdjustments.orderBy('date').reverse().limit(500).toArray();
  list = list.filter(a => a.date >= f && a.date < t);
  if (S.adjPid) list = list.filter(a => String(a.pid) === S.adjPid);
  const totalShort = r2(list.filter(a => a.diff < 0).reduce((s, a) => s + a.costValue, 0));
  const totalSurp = r2(list.filter(a => a.diff > 0).reduce((s, a) => s + a.costValue, 0));
  const products = (await db.products.toArray()).sort((a, b) => a.name.localeCompare(b.name, 'ar'));
  const rows = list.map(a => `<tr>
    <td class="whitespace-nowrap">${fdt(a.date)}</td>
    <td class="font-bold">${esc(a.name)}${a.remote ? ' <span class="badge b-blue">عن بعد</span>' : ''}</td>
    <td>${a.before} → ${a.after}</td>
    <td><b style="color:${a.diff < 0 ? 'var(--red)' : 'var(--green)'}">${a.diff > 0 ? '+' : ''}${a.diff}</b></td>
    <td>${money(a.unitCost)}</td>
    <td><b>${egp(a.costValue)}</b></td>
    <td><span class="badge ${a.type === 'shortage' ? 'b-red' : a.type === 'surplus' ? 'b-ok' : 'b-amb'}">${a.type === 'shortage' ? 'عجز' : a.type === 'surplus' ? 'زيادة' : 'تصحيح'}</span></td>
    <td>${esc(a.reason)}${a.note ? ' <span class="muted">— ' + esc(a.note) + '</span>' : ''}</td>
    <td>${esc(um[a.userId] || (a.remote ? 'المدير' : '-'))}</td>
    <td class="whitespace-nowrap"><button class="btn btn-sec btn-sm" onclick="revertAdj(${a.id})">عكس وحذف</button></td>
  </tr>`).join('');
  $('#view').innerHTML = `
    <div class="flex flex-wrap items-center gap-3 mb-3">
      ${rangeBar(S.adjRange, 'setAdjRange')}
      <select class="inp" style="max-width:16rem" onchange="S.adjPid=this.value;VIEWS.stockAdj()">
        <option value="">كل الأصناف</option>
        ${products.map(p => `<option value="${p.id}" ${String(p.id) === S.adjPid ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
      </select>
    </div>
    <div class="grid gap-3 md:grid-cols-3 mb-4">
      <div class="card stat"><div class="k">إجمالي العجز (خسارة)</div><div class="v" style="color:var(--red)">${egp(totalShort)}</div></div>
      <div class="card stat"><div class="k">إجمالي الزيادة</div><div class="v" style="color:var(--green)">${egp(totalSurp)}</div></div>
      <div class="card stat"><div class="k">الصافي</div><div class="v">${egp(totalShort - totalSurp)}</div></div>
    </div>
    <div class="p-3 rounded-lg text-xs mb-3" style="background:#f6f8fb;color:var(--muted)">
      💡 العجز يُحسب تلقائياً كخسارة في التقارير. الزيادة تُخفّض قيمة الخسارة.
    </div>
    ${tbl(['التاريخ','الصنف','الرصيد','الفرق','تكلفة الوحدة','القيمة','النوع','السبب','المستخدم',''], rows, 'لا توجد تسويات جرد')}`;
};
function setAdjRange(k) { S.adjRange = k; VIEWS.stockAdj(); }
async function revertAdj(id) {
  const a = await db.stockAdjustments.get(id);
  if (!a) return;
  if (!(await confirmBox(`عكس هذا الجرد:\n\n• رصيد "${a.name}" يرجع من ${a.after} إلى ${a.before}\n• حذف السجل نهائياً`, {danger: true, ok: 'عكس وحذف'}))) return;
  try {
    await db.transaction('rw', db.products, db.stockAdjustments, db.auditLog, async () => {
      const p = await db.products.get(a.pid);
      if (!p) throw new Error('الصنف محذوف');
      await db.products.update(a.pid, {stockUnits: a.before});
      await db.stockAdjustments.delete(id);
      await db.auditLog.add({date: Date.now(), userId: S.user.id, action: 'revert_stock_adjust',
        details: `عكس جرد ${a.name} (${a.before} → ${a.after}) بقيمة ${money(a.costValue)}`});
    });
    toast('تم عكس الجرد');
    schedulePush();
    VIEWS.stockAdj();
  } catch (e) { toast(e.message || 'فشل العكس', 'err'); }
}
async function hideProduct(id) {
  const p = S.pmap[id];
  if (p.remote) return toast('لا يمكن حذف صنف أضافه المدير', 'err');
  if (!(await confirmBox(`إخفاء الصنف "${p.name}"؟`, {danger: true, ok: 'حذف'}))) return;
  await db.products.update(id, {active: false});
  await audit('hide_product', `حذف (إخفاء) الصنف ${p.name}`);
  toast('تم'); schedulePush(); VIEWS.products();
}
async function showProduct(id) {
  await db.products.update(id, {active: true});
  await audit('show_product', `إعادة إظهار الصنف ${S.pmap[id].name}`);
  schedulePush(); VIEWS.products();
}

  const sm = Object.fromEntries((await db.suppliers.toArray()).map(s => [s.id, s.name]));
  const rows = list.map(p => `<tr style="${p.status === 'cancelled' ? 'opacity:.5' : ''}"><td>${p.id}${p.remote ? ' <span class="badge b-blue">عن بعد</span>' : ''}</td><td>${fdt(p.date)}</td><td class="font-bold">${esc(sm[p.supplierId] || '-')}</td><td>${p.items.length}</td><td>${money(p.total)}</td><td>${money(p.paid)}</td>
    <td>${p.due > 0 ? `<b style="color:var(--red)">${money(p.due)}</b>` : '0'}</td><td><span class="badge ${p.method === 'cash' ? 'b-ok' : 'b-amb'}">${p.method === 'cash' ? 'نقدي' : p.method === 'credit' ? 'آجل' : 'جزئي'}</span></td>
    <td class="whitespace-nowrap"><button class="btn btn-sec btn-sm" onclick="viewPurchase(${p.id})">عرض</button>${p.status === 'cancelled' ? ' <span class="badge b-red">ملغاة</span>' : (p.remote ? '' : ` <button class="btn btn-sec btn-sm" onclick="newPurchase(${p.id})">تعديل</button> <button class="btn btn-sec btn-sm" onclick="deletePurchase(${p.id})">حذف</button>`)}</td></tr>`).join('');
  $('#view').innerHTML = `<div class="flex mb-3"><div class="flex-1"></div><button class="btn btn-pri" onclick="newPurchase()">+ فاتورة شراء جديدة</button></div>
    ${tbl(['#', 'التاريخ', 'المورد', 'البنود', 'الإجمالي', 'المدفوع', 'المتبقي', 'الدفع', ''], rows, 'لا توجد فواتير شراء')}`;
};
async function viewPurchase(id) {
  const p = await db.purchases.get(id), s = await db.suppliers.get(p.supplierId);
  const rows = p.items.map(i => `<tr><td>${esc(i.name)}</td><td>${i.cartons} كرتونة + ${i.loose}</td><td>${i.units}</td><td>${money(i.cartonCost)}</td><td class="font-bold">${money(i.total)}</td></tr>`).join('');
  showModal({title: `فاتورة شراء #${id}`, size: 'lg', body: `<div class="text-sm muted mb-2">${fdt(p.date)} • ${esc(s ? s.name : '-')}${p.remote ? ' • <span class="badge b-blue">من المدير</span>' : ''}</div>${tbl(['الصنف', 'الكمية', 'إجمالي الجراكن', 'تكلفة الكرتونة', 'الإجمالي'], rows)}
    <div class="mt-3 space-y-1 text-sm"><div class="flex justify-between"><span>الإجمالي</span><b>${egp(p.total)}</b></div><div class="flex justify-between"><span>المدفوع</span><b>${egp(p.paid)}</b></div><div class="flex justify-between"><span>المتبقي</span><b>${egp(p.due)}</b></div></div>`});
}
async function applyPurchaseItems(items) {
  for (const it of items) {
    const p = await db.products.get(it.pid);
    if (!p) throw new Error('صنف غير موجود: ' + it.name);
    const base = Math.max(p.stockUnits || 0, 0);
    const avg = (base * (p.avgCost || 0) + it.units * it.unitCost) / (base + it.units);
    await db.products.update(p.id, {stockUnits: r4((p.stockUnits || 0) + it.units), lastCost: r4(it.unitCost), avgCost: r4(avg)});
  }
}
async function reversePurchase(old) {
  const others = (await db.purchases.toArray()).filter(x => x.id !== old.id && x.status !== 'cancelled').sort((a, b) => b.date - a.date);
  for (const it of old.items) {
    const p = await db.products.get(it.pid);
    if (!p) continue;
    const remain = (p.stockUnits || 0) - it.units;
    let avg = p.avgCost || 0, last = p.lastCost || 0;
    if (remain > 0) { const a = ((p.stockUnits || 0) * avg - it.units * it.unitCost) / remain; if (a > 0) avg = a; }
    const prev = others.find(x => x.items.some(i => i.pid === it.pid));
    if (prev && old.date >= prev.date) last = prev.items.filter(i => i.pid === it.pid).pop().unitCost;
    await db.products.update(p.id, {stockUnits: r4(remain), avgCost: r4(avg), lastCost: r4(last)});
  }
  if (old.due > 0) {
    const sp = await db.suppliers.get(old.supplierId);
    if (sp) await db.suppliers.update(sp.id, {balance: r2((sp.balance || 0) - old.due)});
  }
}
async function checkNoNegative(pids) {
  if (S.cfg.allowNegative) return;
  for (const pid of pids) {
    const p = await db.products.get(pid);
    if (p && (p.stockUnits || 0) < -1e-9) throw new Error(`جزء من ${p.name} تم بيعه بالفعل (الرصيد ${p.stockUnits})`);
  }
}
async function deletePurchase(id) {
  const first = await db.purchases.get(id);
  if (!first || first.status === 'cancelled') return toast('غير متاحة', 'err');
  if (first.remote) return toast('لا يمكن حذف فاتورة أرسلها المدير', 'err');
  const reason = await askText({title: `حذف فاتورة الشراء #${id}`, label: 'سبب الحذف (إجباري)', ok: 'حذف'});
  if (!reason) return;
  try {
    await db.transaction('rw', db.purchases, db.products, db.suppliers, db.auditLog, async () => {
      const cur = await db.purchases.get(id);
      if (!cur || cur.status === 'cancelled') throw new Error('ملغاة');
      await reversePurchase(cur);
      await checkNoNegative(cur.items.map(i => i.pid));
      await db.purchases.update(id, {status: 'cancelled', cancelReason: reason, cancelledAt: Date.now()});
      await db.auditLog.add({date: Date.now(), userId: S.user.id, action: 'del_purchase', details: `حذف فاتورة شراء #${id} بقيمة ${money(cur.total)} - ${reason}`});
    });
  } catch (e) { console.error(e); return toast(e.message || 'فشل', 'err'); }
  toast('تم الحذف');
  schedulePush();
  VIEWS.purchases();
}
async function newPurchase(editId = null) {
  await loadProducts();
  const old = editId ? await db.purchases.get(editId) : null;
  if (editId && (!old || old.status === 'cancelled')) return toast('غير متاحة', 'err');
  const sups = await db.suppliers.toArray();
  const usedIds = old ? old.items.map(i => i.pid) : [];
  const prods = S.prods.filter(p => p.active || usedIds.includes(p.id));
  if (!sups.length) return toast('أضف مورداً أولاً', 'err');
  if (!prods.length) return toast('لا توجد أصناف', 'err');
  const D = {items: old ? old.items.map(i => ({pid: String(i.pid), cartons: i.cartons || '', loose: i.loose || '', cost: i.cartonCost})) : [{pid: '', cartons: '', loose: '', cost: ''}]};
  const lineCalc = it => {
    const p = S.pmap[+it.pid];
    if (!p) return {units: 0, total: 0};
    const upc = p.unitsPerCarton || 1;
    const units = num(it.cartons) * upc + num(it.loose);
    return {units, total: r2(units * num(it.cost) / upc)};
  };
  const m = formModal({
    title: old ? `تعديل فاتورة الشراء #${editId}` : 'فاتورة شراء جديدة', size: 'xl', ok: old ? 'حفظ' : 'حفظ الفاتورة', noEnter: true,
    body: `<div class="grid sm:grid-cols-2 gap-3 mb-3">
        ${fld('المورد', `<select id="pu-sup" class="inp">${sups.map(s => `<option value="${s.id}" ${old && old.supplierId === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>`)}
        ${fld('التاريخ', `<input id="pu-date" type="date" class="inp" value="${toInputDate(old ? old.date : Date.now())}">`)}</div>
      <div id="pu-rows" class="space-y-2"></div>
      <button class="btn btn-sec btn-sm mt-2" id="pu-add">+ إضافة صنف</button>
      <div class="grid sm:grid-cols-3 gap-3 mt-4 items-end">
        <div><div class="lbl">إجمالي الفاتورة</div><div id="pu-total" class="text-xl font-extrabold">0 ج.م</div></div>
        ${fld('المدفوع', ni('pu-paid', old ? old.paid : ''))}
        <div><div class="lbl">المتبقي</div><div id="pu-due" class="text-xl font-extrabold" style="color:var(--red)">0 ج.م</div></div></div>
      <div class="flex gap-2 mt-2"><button class="btn btn-sec btn-sm" id="pu-full">سداد كامل</button><button class="btn btn-sec btn-sm" id="pu-credit">آجل بالكامل</button></div>`,
    onSubmit: async mm => {
      const items = [];
      for (const it of D.items) {
        if (!it.pid && !num(it.cartons) && !num(it.loose) && !num(it.cost)) continue;
        const p = S.pmap[+it.pid];
        if (!p) { toast('اختر الصنف', 'err'); return false; }
        const lc = lineCalc(it);
        if (lc.units <= 0) { toast('كمية غير صحيحة', 'err'); return false; }
        if (num(it.cost) <= 0) { toast('تكلفة غير صحيحة', 'err'); return false; }
        const upc = p.unitsPerCarton || 1;
        items.push({pid: p.id, name: p.name, size: p.size || '', upc, cartons: num(it.cartons), loose: num(it.loose), cartonCost: num(it.cost), units: lc.units, unitCost: num(it.cost) / upc, total: lc.total});
      }
      if (!items.length) { toast('أضف صنفاً', 'err'); return false; }
      const total = r2(items.reduce((s, i) => s + i.total, 0));
      const paidIn = num(mm.q('#pu-paid').value);
      if (paidIn > total + 0.001) { toast('المدفوع أكبر', 'err'); return false; }
      const paid = r2(Math.max(paidIn, 0)), due = r2(total - paid);
      const supId = +mm.q('#pu-sup').value;
      const dv = mm.q('#pu-date').value;
      let d;
      if (old && dv === toInputDate(old.date)) d = old.date;
      else { d = fromInputDate(dv); d = sod(d) === sod(Date.now()) ? Date.now() : d + 12 * 3600000; }
      const method = due === 0 ? 'cash' : paid === 0 ? 'credit' : 'partial';
      await db.transaction('rw', db.purchases, db.products, db.suppliers, db.auditLog, async () => {
        let cur = null;
        if (editId) {
          cur = await db.purchases.get(editId);
          if (!cur || cur.status === 'cancelled') throw new Error('غير متاحة');
          await reversePurchase(cur);
        }
        await applyPurchaseItems(items);
        if (due > 0) { const sp = await db.suppliers.get(supId); await db.suppliers.update(supId, {balance: r2((sp.balance || 0) + due)}); }
        await checkNoNegative([...new Set(items.map(i => i.pid).concat(cur ? cur.items.map(i => i.pid) : []))]);
        const rec = {date: d, supplierId: supId, items, total, paid, due, method, status: 'active', userId: S.user.id};
        if (cur) {
          await db.purchases.update(editId, {...rec, userId: cur.userId, editedAt: Date.now()});
          await db.auditLog.add({date: Date.now(), userId: S.user.id, action: 'edit_purchase', details: `تعديل شراء #${editId} من ${money(cur.total)} إلى ${money(total)}`});
        } else {
          const id = await db.purchases.add(rec);
          await db.auditLog.add({date: Date.now(), userId: S.user.id, action: 'purchase', details: `فاتورة شراء #${id} بقيمة ${money(total)}`});
        }
      });
      toast(old ? 'تم حفظ التعديل' : 'تم حفظ الفاتورة');
      schedulePush();
      VIEWS.purchases();
    }
  });
  const rowsEl = m.q('#pu-rows');
  const totals = () => {
    const t = r2(D.items.reduce((s, it) => s + lineCalc(it).total, 0));
    m.q('#pu-total').textContent = egp(t);
    m.q('#pu-due').textContent = egp(Math.max(t - Math.min(num(m.q('#pu-paid').value), t), 0));
    return t;
  };
  const lineLabel = it => { const c = lineCalc(it); return c.units ? `${c.units} جركن = ${money(c.total)}` : '-'; };
  const draw = () => {
    rowsEl.innerHTML = D.items.map((it, i) => `<div class="grid grid-cols-2 md:grid-cols-[2.2fr_1fr_1fr_1.2fr_1.4fr_auto] gap-2 items-end p-2 rounded-lg" style="border:1px solid var(--line)" data-i="${i}">
      <div class="col-span-2 md:col-span-1"><label class="lbl">الصنف</label><select data-f="pid" class="inp"><option value="">اختر...</option>${prods.map(p => `<option value="${p.id}" ${+it.pid === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>
      <div><label class="lbl">كراتين</label><input data-f="cartons" type="number" min="0" step="any" class="inp" value="${esc(it.cartons)}"></div>
      <div><label class="lbl">فرط</label><input data-f="loose" type="number" min="0" step="any" class="inp" value="${esc(it.loose)}"></div>
      <div><label class="lbl">تكلفة الكرتونة</label><input data-f="cost" type="number" min="0" step="any" class="inp" value="${esc(it.cost)}"></div>
      <div class="text-sm"><div class="lbl">الإجمالي</div><b id="pl-${i}">${lineLabel(it)}</b></div>
      <button class="btn btn-sec btn-sm" data-rm="${i}">✕</button></div>`).join('');
    totals();
  };
  rowsEl.addEventListener('input', e => {
    const row = e.target.closest('[data-i]'), f = e.target.dataset.f;
    if (!row || !f) return;
    const i = +row.dataset.i;
    D.items[i][f] = e.target.value;
    if (f === 'pid') {
      const p = S.pmap[+e.target.value];
      if (p) { D.items[i].cost = r2((p.lastCost || 0) * (p.unitsPerCarton || 1)) || ''; row.querySelector('[data-f=cost]').value = D.items[i].cost; }
    }
    $('#pl-' + i, m.el).textContent = lineLabel(D.items[i]);
    totals();
  });
  rowsEl.addEventListener('click', e => {
    const b = e.target.closest('[data-rm]'); if (!b) return;
    if (D.items.length > 1) D.items.splice(+b.dataset.rm, 1); else D.items = [{pid: '', cartons: '', loose: '', cost: ''}];
    draw();
  });
  m.q('#pu-add').onclick = () => { D.items.push({pid: '', cartons: '', loose: '', cost: ''}); draw(); };
  m.q('#pu-paid').oninput = totals;
  m.q('#pu-full').onclick = () => { m.q('#pu-paid').value = totals(); totals(); };
  m.q('#pu-credit').onclick = () => { m.q('#pu-paid').value = 0; totals(); };
  draw();
}

async function editPayment(pid, kind) {
  const P = PARTY[kind], p = await db.payments.get(pid);
  if (!p) return;
  if (p.shiftId && await shiftLocked(p.shiftId)) return toast('دفعة في وردية مقفلة', 'err');
  const x = await P.tbl().get(p.entityId);
  const maxAmt = r2((x.balance || 0) + p.amount);
  formModal({
    title: 'تعديل الدفعة', size: 'sm',
    body: `<div class="space-y-3"><p class="text-sm">أقصى مبلغ: <b>${egp(maxAmt)}</b></p>${fld('المبلغ', ni('pe-a', p.amount))}${fld('ملاحظة', `<input id="pe-n" class="inp" value="${esc(p.note || '')}">`)}</div>`,

      const a = r2(num(m.q('#pe-a').value));
      if (a <= 0) { toast('مبلغ غير صحيح', 'err'); return false; }
      if (a > maxAmt + 0.001) { toast('أكبر من المستحق', 'err'); return false; }
      const note = m.q('#pe-n').value.trim();
      await db.transaction('rw', db.payments, db.customers, db.suppliers, db.shifts, db.auditLog, async () => {
        const cur = await db.payments.get(pid);
        if (!cur) throw new Error('غير موجودة');
        if (cur.shiftId && await shiftLocked(cur.shiftId)) throw new Error('وردية مقفلة');
        const e = await P.tbl().get(cur.entityId);
        await P.tbl().update(e.id, {balance: r2((e.balance || 0) + cur.amount - a)});
        await db.payments.update(pid, {amount: a, note, editedAt: Date.now()});
      });
      toast('تم');
      schedulePush();
      partyPayments(kind, p.entityId); vParties(kind);
    }
  });

async function deletePayment(pid, kind) {
  const P = PARTY[kind], p = await db.payments.get(pid);
  if (!p) return;
  if (p.shiftId && await shiftLocked(p.shiftId)) return toast('وردية مقفلة', 'err');
  if (!(await confirmBox(`حذف الدفعة بقيمة ${money(p.amount)} ج.م؟`, {danger: true, ok: 'حذف'}))) return;
  try {
    await db.transaction('rw', db.payments, db.customers, db.suppliers, db.shifts, db.auditLog, async () => {
      const cur = await db.payments.get(pid);
      if (!cur) throw new Error('غير موجودة');
      if (cur.shiftId && await shiftLocked(cur.shiftId)) throw new Error('وردية مقفلة');
      const e = await P.tbl().get(cur.entityId);
      await P.tbl().update(e.id, {balance: r2((e.balance || 0) + cur.amount)});
      await db.payments.delete(pid);
    });
  } catch (e) { return toast(e.message, 'err'); }
  toast('تم الحذف');
  schedulePush();
  partyPayments(kind, p.entityId); vParties(kind);
}
async function partyStatement(kind, id) {
  const P = PARTY[kind], x = await P.tbl().get(id);
  const pays = (await db.payments.where('entityId').equals(id).toArray()).filter(p => p.entityType === kind);
  let ev = pays.map(p => ({date: p.date, desc: `دفعة ${kind === 'customer' ? 'مستلمة' : 'مسددة'}${p.note ? ' - ' + p.note : ''}`, inc: 0, dec: p.amount}));
  if (kind === 'customer') {
    const sales = (await db.sales.where('customerId').equals(id).toArray()).filter(s => s.status !== 'deleted' && s.method === 'credit');
    ev = ev.concat(sales.map(s => ({date: s.date, desc: `فاتورة بيع ${s.invNo}`, inc: s.total, dec: 0})));
  } else {
    const pu = (await db.purchases.where('supplierId').equals(id).toArray());
    ev = ev.concat(pu.filter(p => p.due > 0 && p.status !== 'cancelled').map(p => ({date: p.date, desc: `فاتورة شراء #${p.id}`, inc: p.due, dec: 0})));
  }
  ev.sort((a, b) => a.date - b.date);
  const opening = r2((x.balance || 0) - ev.reduce((s, e) => s + e.inc - e.dec, 0));
  let run = opening;
  const rowsArr = [];
  if (opening !== 0) rowsArr.push(`<tr><td>-</td><td>رصيد سابق</td><td></td><td></td><td>${money(opening)}</td></tr>`);
  ev.forEach(e => { run = r2(run + e.inc - e.dec); rowsArr.push(`<tr><td>${fdt(e.date)}</td><td>${esc(e.desc)}</td><td>${e.inc ? money(e.inc) : ''}</td><td>${e.dec ? money(e.dec) : ''}</td><td><b>${money(run)}</b></td></tr>`); });
  const table = `<table class="tbl"><thead><tr><th>التاريخ</th><th>البيان</th><th>له</th><th>دفعات</th><th>الرصيد</th></tr></thead><tbody>${rowsArr.join('') || '<tr><td colspan="5" class="empty">لا توجد حركات</td></tr>'}</tbody></table>`;
  const m = showModal({
    title: `كشف حساب: ${x.name}`, size: 'xl',
    body: `<div class="flex justify-between mb-3 text-sm"><span>${esc(x.phone || '')}</span><span>الرصيد: <b>${egp(x.balance)}</b></span></div><div class="overflow-x-auto">${table}</div>`,
    footer: `<button class="btn btn-sec" data-p>طباعة</button>`
  });
  m.q('[data-p]').onclick = () => printHTML(`<div dir="rtl"><h2 style="text-align:center;font-weight:800;font-size:18px">${esc(S.cfg.shopName)}</h2><h3 style="text-align:center;margin-bottom:8px">كشف حساب: ${esc(x.name)} - ${fdate(Date.now())}</h3>${table.replace('class="tbl"', '')}<p style="margin-top:8px;font-weight:800">الرصيد: ${egp(x.balance)}</p></div>`, true);
}
